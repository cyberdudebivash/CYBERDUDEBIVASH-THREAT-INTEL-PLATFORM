<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Enterprise Knowledge Graph &mdash; CYBERDUDEBIVASH SENTINEL APEX</title>
<!--
  evidence-threat-map.html (2026-09-27) was a static threat map with hardcoded statistics and randomly generated "live"
  counters; it made no API call. enterprise-knowledge-graph.html renders the real
  evidence-linked entity graph (P31) from the platform API.

  It is replaced with a redirect -- the same pattern as customer-portal.html
  and PAYMENT-GATEWAY.html -- so bookmarked, homepage and external links still
  land on a real, data-backed page instead of 404ing or showing invented data.
-->
<meta name="description" content="Evidence-Backed Threat Map has moved. Continue to the Enterprise Knowledge Graph at /enterprise-knowledge-graph.html.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://intel.cyberdudebivash.com/enterprise-knowledge-graph.html">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta http-equiv="refresh" content="0; url=/enterprise-knowledge-graph.html">
<script>
  var qs = window.location.search || '';
  window.location.replace('/enterprise-knowledge-graph.html' + qs);
</script>
<style>
  body { background:#050c18; color:#e2e8f0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; padding:0 16px; }
  a { color:#00ffc6; }
</style>
</head>
<body>
  <p>Evidence-Backed Threat Map has moved. Redirecting to <a href="/enterprise-knowledge-graph.html">the Enterprise Knowledge Graph</a>&hellip;</p>
</body>
</html>
