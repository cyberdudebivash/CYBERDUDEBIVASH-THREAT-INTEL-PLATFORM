<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to API Key Manager &mdash; CYBERDUDEBIVASH SENTINEL APEX</title>
<!--
  api-management-center.html was a static UI mockup: hardcoded stat
  counters and chart data, zero fetch() calls, no live backend anywhere in
  the file (confirmed by this repo's own P41 component registry test
  fixture, workers/intel-gateway/src/__tests__/p41-handlers.test.js, which
  already tags this page status:"orphan", notes:"hardcoded stat counters,
  zero fetch"). sentinel-onboarding.html's "View API Keys" button sent a
  customer who had just paid straight to this fake dashboard.

  api-key-manager.html is the real equivalent already live in production:
  it authenticates with the customer's own API key or SSO JWT
  (sessionStorage + Bearer header) and calls the real intel-gateway backend
  (apiFetch() -> https://intel.cyberdudebivash.com) for keys, usage,
  webhooks and reports.

  Rather than rewrite this page's markup in place, it's replaced with a
  redirect -- the same pattern already used for PAYMENT-GATEWAY.html and
  customer-portal.html -- so any bookmarked or externally-linked URL still
  lands somewhere real instead of showing fake data.
-->
<meta name="description" content="This page has moved. Continue to the real API key dashboard at /api-key-manager.html.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://intel.cyberdudebivash.com/api-key-manager.html">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta http-equiv="refresh" content="0; url=/api-key-manager.html">
<script>
  var qs = window.location.search || '';
  window.location.replace('/api-key-manager.html' + qs);
</script>
<style>
  body { background:#050c18; color:#e2e8f0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
  a { color:#00ffc6; }
</style>
</head>
<body>
  <p>Redirecting to <a href="/api-key-manager.html">your API key dashboard</a>&hellip;</p>
</body>
</html>
