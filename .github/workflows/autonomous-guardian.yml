# =============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX v184.0 - AUTONOMOUS GUARDIAN AGENT
# Version: v184.0 - unified platform version
# NOTE: sync-dashboard.yml DISABLED in v184.0 - removed from workflow_run list.
#       Guardian still triggers on sentinel-blogger completion + 2x daily schedule.
#
# HARDENING (v184.0 - OPTIMIZED DUAL TRIGGER DESIGN):
#   This workflow has TWO triggers by design:
#     1. workflow_run (sentinel-blogger completed) - fires immediately after blogger
#     2. schedule cron '30 0,12 * * *' - 2x daily at 00:30 and 12:30 UTC
#
#   CONCURRENCY: cancel-in-progress: true
#     Guardian runs are idempotent health checks - they read state and write a report.
#     If sentinel-blogger completes, the post-run guardian fires immediately.
#     The 2x daily schedule provides fallback coverage.
#     This prevents guardian queue buildup during high-frequency pipeline runs.
# =============================================================================
name: Autonomous Guardian Agent v201.0

on:
  workflow_run:
    # v184.0: sync-dashboard removed - it is DISABLED (merged into sentinel-blogger).
    # Only sentinel-blogger triggers guardian post-run checks.
    workflows: ["sentinel-blogger"]
    types: [completed]
  schedule:
    - cron: '30 0,12 * * *'   # 2x daily: 00:30 UTC + 12:30 UTC (128 min/day savings)
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Hours to look back for failures'
        default: '6'
        required: false
      force_report:
        description: 'Force full report even if no failures'
        default: 'false'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: autonomous-guardian
  # cancel-in-progress: true -- Guardian is an idempotent health sweep.
  # The latest run always has the most current pipeline state.
  # Cancel stale queued runs to prevent report queue buildup.
  cancel-in-progress: true

jobs:
  guardian:
    name: Autonomous Guardian Cycle v140
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python 3.12"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Install Dependencies"
        run: pip install requests pyyaml --quiet

      - name: "Bootstrap Critical Files"
        run: python3 scripts/bootstrap_critical_files.py

      - name: "Run Autonomous Guardian"
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '6' }}
          FORCE_REPORT: ${{ github.event.inputs.force_report || 'false' }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || 'scheduled' }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'n/a' }}
        run: python3 agent/autonomous_guardian/guardian.py || true

      - name: "Preserve Guardian report for review"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.email "bivash@cyberdudebivash.com"
          git config user.name "CYBERDUDEBIVASH"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git diff --cached --quiet
          test -s data/health/guardian_report.json
          git add -f -- data/health/
          # sentinel-blogger retains ownership of feed_manifest.json.
          if git diff --staged --quiet; then
            echo "No guardian report changes."
          else
            git commit -m "Guardian report for run ${GITHUB_RUN_ID} [skip ci]"
            python scripts/publish_generated_commit.py
          fi

      - name: "Summary"
        if: always()
        run: |
          [ -f data/health/guardian_report.json ] && \
            python3 -c "import json; d=json.load(open('data/health/guardian_report.json')); print(f'Guardian: {d.get(\"status\",\"N/A\")} | Failures: {d.get(\"failures_detected\",0)} | Fixes: {d.get(\"fixes_applied\",0)}')" || \
            echo "No guardian report."
