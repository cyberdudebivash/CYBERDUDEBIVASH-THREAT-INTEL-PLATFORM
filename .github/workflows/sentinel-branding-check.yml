name: SENTINEL APEX presentation branding
on:
  pull_request:
    paths:
      - 'scripts/sentinel-branding.cjs'
      - 'scripts/sentinel-branding.test.cjs'
      - 'scripts/build_dist_artifact.py'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'manifest.json'
      - 'platform/frontend/src/app/layout.tsx'
      - '.github/workflows/sentinel-branding-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node --test scripts/sentinel-branding.test.cjs

