name: CDB Sentinel APEX  -  OmniShield v201.0

on:
  schedule:
    - cron: '15 */12 * * *'  # Every 12 hours
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# Resource-scoped lock: this workflow reads shared intelligence but writes only
# its own derived namespace. A global sentinel-data-writer lock can starve or
# cancel pending jobs because GitHub concurrency retains only one pending run.
concurrency:
  group: sentinel-data-writer-omnishield
  cancel-in-progress: false

jobs:
  omnishield:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 1, ref: "${{ github.ref }}"}

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: 'pip'}

      - name: Install deps
        run: pip install --upgrade pip && pip install requests feedparser networkx && [ -f requirements.txt ] && pip install -r requirements-ci-light.txt || true

      - name: Run OmniShield Engine
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          MANIFEST_PATH: data/stix/feed_manifest.json
          FUSION_DIR: data/fusion
          ZDH_DIR: data/zerodayhunter
          OMNISHIELD_DIR: data/omnishield
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent.v36_omnishield.omnishield_orchestrator

      - name: Preserve generated OmniShield artifacts for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "CYBERDUDEBIVASH"
          git config user.email "bivash@cyberdudebivash.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          test -s data/omnishield/omnishield_report.json
          git add -f data/omnishield/
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "OmniShield v36.0 generated artifacts - $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            python scripts/publish_generated_commit.py
          fi
