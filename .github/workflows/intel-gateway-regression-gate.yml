# SENTINEL APEX -- Intel Gateway Regression Gate
#
# ROOT CAUSE THIS CLOSES
# workers/intel-gateway is the platform's main product surface -- the Worker
# that serves intel.cyberdudebivash.com/api/*, /reports/*, /taxii/* and
# /auth/*. It ships 122 test files / 1121 tests. NONE of them gated a pull
# request.
#
# deploy-worker.yml, which owns the gateway's test gates, triggers only on
# `push: branches: [main]` -- i.e. AFTER merge. No pull_request-triggered
# workflow in this repository ran the gateway suite at all (confirmed by
# enumerating the `on:` block of every workflow). A PR could therefore be
# fully green while shipping a broken gateway, and post-merge failure is the
# expensive place to find out.
#
# That is not hypothetical: four zero-blast-radius boundary tests sat failing
# on main undetected, because nothing in the PR path executed them.
#
# This is the same class of gap, on a far more important worker, that
# swarm-live-regression-gate.yml was created to close for workers/swarm-live
# ("had zero CI coverage: no workflow referenced it at all"). This gate
# mirrors that one's structure deliberately.
#
# NO DEPENDENCY INSTALL BY DESIGN
# The gateway's tests are dependency-free -- they import only node: builtins
# and the worker's own ESM sources (verified: 1121/1121 pass in ~6s with no
# node_modules present). Skipping `npm ci` keeps this gate fast AND keeps the
# gateway's only devDependency chain -- wrangler -> miniflare -> sharp, which
# carries known high-severity libheif advisories -- out of pull-request CI
# entirely. Wrangler is a deploy-time tool; it is not needed to run tests.
#
# This gate is validation-only. It never deploys the gateway; production
# promotion remains deploy-worker.yml's explicit, separate decision.

name: Intel Gateway Regression Gate v201.0

on:
  push:
    branches: [main]
    paths:
      - 'workers/intel-gateway/src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/intel-gateway-regression-gate.yml'
      - '.github/workflows/deploy-revenue-engine.yml'
      # Cyber Watchdog: the gateway suite also imports the canary library and
      # reads these pages (publication-truth, watchdog-canary tests).
      - 'workers/intel-gateway/scripts/watchdog-negative-controls.mjs'
      # AI Threat Feed seed catalog (ai-threat-feed.test.js parity).
      - 'config/ai-threat-feed-catalog.json'
      # Customer dashboard data contract: the suite and its negative controls
      # read these runtime files.
      - 'workers/intel-gateway/scripts/dashboard-negative-controls.mjs'
      # Commercial policy v1 billing (refunds, GST invoices, subscriptions-
      # only checkout): the controls mutate revenue-engine + gateway code.
      - 'workers/revenue-engine/scripts/billing-negative-controls.mjs'
      - 'workers/revenue-engine/src/**'
      - 'revenue-crm/schema.sql'
      - 'js/sentinel-live-feeds.js'
      - 'js/apex-dashboard-snapshot.js'
      - 'service-worker.js'
      - 'deploy/cyber-watchdog/**'
      - 'deploy/billing-canary/**'
      - 'index.html'
      - 'cyber-watchdog.html'
      # SENTINEL APEX UI system: watchdog-apex-ui.test.js and its negative
      # controls read these.
      - 'css/apex-design-tokens.css'
      - 'css/homepage-design-system.css'
      - 'js/homepage-dashboard-engine.js'
      - 'scripts/homepage_source.py'
      - 'security.txt'
      - '.well-known/**'
      - 'scripts/security_txt_validator.py'
      - '*.html'
      - 'blog/**'
      - 'sitemap*.xml'
      - 'favicon.ico'
      - 'dashboard/**'
      - '.github/workflows/sla-heartbeat.yml'
      - 'scripts/build_dist_artifact.py'
      - 'js/apex-status-model.js'
      - 'js/card_renderer.js'
      # ATT&CK reference: dashboard-contract.test.js checks the generated
      # technique->tactic table against it.
      - 'data/attck/**'
      # MSSP tenant self-service: the suite checks these docs against the
      # live routes, and a negative control mutates revenue-engine rotation.
      - 'MSSP_PARTNER_PROGRAM.md'
      - 'mssp.html'
      - 'docs/MSSP_TENANT_IDENTITY_V185.md'
      - 'workers/revenue-engine/src/**'
      # Customer-visible release labels and MSSP commercial copy (checked
      # below by customer_release_label.py and verify_commercial_contract.py).
      - '*.html'
      - 'MSSP_OPERATIONAL_RUNBOOK.md'
      - 'mssp-onboarding-kit/**'
      - 'config/commercial-contract.json'
      - 'VERSION'
      # README.md tier table, social-proof register, measured evidence
      # floors and the customer key page (commercial claims suite).
      - 'README.md'
      - 'config/evidence-register.json'
      - 'config/platform-evidence.json'
      - 'customer/**'
  # Required-check readiness (2026-10-02): no path filter on pull requests.
  # A required status check that a path filter skips never reports, so a
  # pull request touching none of these paths (docs only, for example) would
  # wait for it forever. Every pull request to main therefore runs both jobs
  # below; their job names are the check names a ruleset requires (see
  # tests/test_regression_gate_required_check_readiness.py). Pushes to main
  # keep the path filter above.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: intel-gateway-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: "workers/intel-gateway -- full unit suite (1121 tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Node.js 22"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # P0: a malformed Worker helper once caused 35 import failures in a
      # fully merged PR. Check parser integrity before running the entire
      # expensive gateway suite. These steps never deploy or mutate Cloudflare.
      - name: "P0 Worker ES module syntax preflight"
        run: |
          node --check workers/intel-gateway/src/intel-static-proxy.js
          node --check workers/intel-gateway/src/index.js

      # Guard the storefront's stale-SW recovery path before its Pages browser
      # smoke test. Promise rejection tests are offline and make no HTTP calls.
      - name: "P0 stale Service Worker update-rejection negative controls (offline)"
        run: node --test tests/sw-anti-stale-rejection.test.cjs

      - name: "P0 public customer-ready report fetch-back negative controls (offline)"
        run: |
          node --check js/customer-report-catalog-view.js
          node --test tests/customer-report-fetchback-probe.test.mjs tests/customer-report-catalog-view.test.mjs tests/api-docs-public-feed-contract.test.mjs

      # Exactly the same resolveCertification() used by the deployed Worker.
      # Six fixture snapshots only; no network calls or Cloudflare writes.
      - name: "P0 persisted certification replay negative controls (offline)"
        run: node --test tests/certification-registry-replay.test.mjs

      - name: "Homepage AI assessment presentation regressions"
        run: node --test tests/ai-assessment-presentation.test.cjs tests/latest-advisory-ticker.test.cjs tests/live-feed-ioc-counter.test.cjs tests/recon-evidence-presentation.test.cjs tests/tipsoar-rendering-security.test.cjs tests/ai-analysis-rendering-security.test.cjs tests/sovereign-feed-evidence.test.cjs tests/cortex-relationship-evidence.test.cjs tests/quantum-source-evidence.test.cjs

      # P0: a missing/empty publication feed must never produce a green audit.
      # Pure offline tests: no calls to production APIs, Worker or R2.
      - name: "P0 publication audit fail-closed regression controls"
        run: node --test tests/publication_gate_audit_policy.test.mjs

      # Public feed projections omit certification inputs. Source-of-truth
      # blockers must come from the Worker publication-status route.
      # All calls in this test are in-memory fakes, never live HTTP.
      - name: "P0 authoritative publication reason sample negative controls (offline)"
        run: node --test tests/publication-status-reason-sample.test.mjs

      # `node --test <glob>` requires Node >= 21; pinned to 22 above, matching
      # deploy-worker.yml so a test passing here cannot fail there on runtime.
      - name: "Full gateway unit suite"
        working-directory: workers/intel-gateway
        run: |
          echo "=== workers/intel-gateway -- every test file under src/ ==="
          node --test "src/**/*.test.js" "src/**/*.test.mjs"

      # Outside the gateway tree. Covers the 2026-10-16 certification failure:
      # the enterprise failure watch must follow a feed replaced mid-canary,
      # and must still fail closed when that feed never matches.
      - name: "Cyber Watchdog enterprise failure-watch live feed"
        run: node --test deploy/cyber-watchdog/canary-live-feed.test.mjs

      # Lives outside src/, so the globs above do not match it. It is in
      # deploy-worker.yml's curated gate; included here so the PR path covers
      # the same surface the deploy path does.
      - name: "Demo-key operator contract test"
        working-directory: workers/intel-gateway
        run: node --test scripts/demo-key-operator.contract.test.mjs

      # Mutation proof: each control applies ONE deliberate defect to a temp
      # copy (DNS validation off, HMAC removed, dedupe off, tenant check off,
      # freshness gate off, PRO webhooks allowed, session scope off, scheduler
      # bound off, ...) and requires the Watchdog suites to FAIL. A control the
      # tests do not catch fails this step. Never modifies the checkout.
      - name: "Cyber Watchdog negative controls"
        run: node workers/intel-gateway/scripts/watchdog-negative-controls.mjs

      # Mutation proof for the customer dashboard data contract: each control
      # reintroduces ONE defect (1749/74 fallbacks, Math.random heatmap,
      # hardcoded forecasts, stale shown LIVE, blank Last Sync, zero ATT&CK
      # coverage, CRITICAL-as-campaign, unescaped title, second DOM owner,
      # frozen GitHub mirror, cache-first intelligence, ...) and requires the
      # dashboard suites to FAIL. Never modifies the checkout.
      - name: "Dashboard data contract negative controls"
        run: node workers/intel-gateway/scripts/dashboard-negative-controls.mjs

      # Mutation proof for commercial policy v1 (docs/COMMERCIAL_POLICY_V1.md):
      # each control reintroduces ONE defect (refund amount from the request,
      # no admin check, no compare-and-set, refund window off, not the first
      # purchase, dispute ignored, invoice serial consumed twice, invoice
      # without GST config, export invoiced, CGST/IGST swapped, >16-char
      # number, foreign invoice readable, one-time order for a recurring plan,
      # subscription charge provisioned twice, manual proof accepted) and
      # requires the billing suites (revenue-engine + gateway) to FAIL.
      # S28 billing canary, certified in-process against both Workers
      # (Razorpay test mode faked at the network edge): passes on a correct
      # deployment, fails on a wrong Plan price, a missing webhook secret, a
      # missing Billing Center or a truncated admin page.
      - name: "Billing canary certification"
        run: node --test deploy/billing-canary/canary.test.mjs

      - name: "Commercial billing negative controls"
        run: node workers/revenue-engine/scripts/billing-negative-controls.mjs

      # The only supported rollback target after Watchdog v3: rebuilt from the
      # pinned base commit + overlay; fails on any hash or digest mismatch.
      - name: "Cyber Watchdog safe rollback artifact builds"
        run: node deploy/cyber-watchdog/safe-rollback/build.mjs --out "$RUNNER_TEMP/wd-safe-rollback"

      # Deploy parity: deploy-worker.yml runs sanitize_encoding.py --fix (which
      # rewrites non-ASCII in Worker JS, e.g. U+2026 -> "...") BEFORE its full
      # unit-suite gate. A test that passes on the raw checkout can fail there
      # and silently block every Worker deploy (it did, from #551 to #557).
      # Last step of this job, so the steps above still test the raw checkout.
      - name: "Full gateway unit suite after deploy encoding sanitization"
        run: |
          python3 scripts/sanitize_encoding.py --fix
          cd workers/intel-gateway
          node --test "src/**/*.test.js" "src/**/*.test.mjs"

  python-tests:
    name: "scripts/ + tests/ -- Python unit and regression suites"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # This repository's convention (see access-governance-gate.yml,
      # report-generator-regression-gate.yml) is to install these explicitly:
      # pytest is not in requirements.txt though pytest.ini configures it as
      # the intended runner, and regression_tests.py imports yaml in three
      # places (T12/T25/T41 parse workflow YAML). Installing the full
      # requirements.txt here would be far slower and pulls in cloud SDKs
      # these suites do not need.
      #
      # PyYAML was missing from the first version of this gate: it is present
      # in most dev environments, so the regression suite passed locally at
      # 41/41 and failed in CI at 38/41 with three "No module named 'yaml'"
      # errors -- an environment gap in this gate, not a code regression.
      - name: "Install pytest + PyYAML"
        run: pip install pytest pyyaml --quiet

      # P0 #819/#909: strict UTC chronology and manifest selection are release
      # blockers, not merely diagnostics. This explicit offline PR gate ensures
      # the new sanitized reason codes and the existing fail-closed controls
      # actually execute (the curated Python suite otherwise omits these files).
      # No network, Cloudflare API, R2 writes, customer data or notifications.
      - name: "P0 canonical chronology diagnostics and selection negative controls"
        run: |
          python3 -m pytest -q --strict-markers \
            tests/test_deployment_convergence_chronology_diagnostics.py \
            tests/test_strict_report_probe_selection.py \
            tests/test_report_chronology_integrity.py

      # P0 report-catalog / feed-window resolution is an offline precheck.
      # Mandatory explicit test step: Python CI uses a scoped test allowlist.
      - name: "P0 certification source coverage offline negative controls"
        run: python3 -m pytest -q tests/test_certification_source_coverage.py

      # Scoped to the suites that are self-contained -- no network, no cloud
      # SDK, no credentials. Deliberately NOT `pytest tests/`: 115 modules live
      # there and several require boto3 or network access, so a whole-directory
      # run would be flaky and would train reviewers to ignore this gate.
      # Widening this list is a separate, evidence-led change.
      #
      # `--strict-markers` and a collection guard below make a vacuous pass
      # impossible. genesis-powerhouse.yml documents the incident this guards
      # against: pytest was never installed and `| tail -15` swallowed the
      # "No module named pytest" failure, so the step "passed" having run
      # nothing. Nothing here is piped, and `set -o pipefail` is set regardless.
      - name: "Operator onboarding credential and payment truth"
        run: |
          python3 -m unittest discover -s tests -p test_customer_onboard_handoff.py -v
          python3 -m unittest discover -s tests -p test_customer_onboard_billing_truth.py -v

      - name: "Python unit tests (self-contained suites)"
        shell: bash
        run: |
          set -euo pipefail
          SUITES=(
            tests/test_exposure_intel_enricher.py
            tests/test_source_fabric_health.py
            # P0 health/freshness contract (self-contained: no network --
            # HTTP is stubbed; the Worker cross-checks use `node` when present).
            tests/test_public_freshness_contract.py
            tests/test_public_feed_freshness_gate.py
            tests/test_deployment_health_contract.py
            # P0 Phase 3A/3E: rollback canary + single freshness authority
            # (self-contained; HTTP is never called).
            tests/test_post_rollback_canary.py
            # Pinned-clock boundary/parity across every health consumer.
            tests/test_health_consumer_clock_parity.py
            tests/test_orchestrator_freshness_single_authority.py
            # P0 Phase 6: stale-quota guard derives from the commercial contract.
            tests/test_enterprise_pricing.py
            # P0 Phase 3D: bounded contract reads / bounded /api/preview.
            tests/test_feed_contract_validator_bounded_preview.py
            # P0 Phase 3C: apex.json single producer / canary contract.
            tests/test_apex_feed_single_producer.py
            # v201 convergence: customer-visible release labels.
            tests/test_customer_release_label.py
            # P0 revenue go-live S2/S25: customer-facing commercial copy truth
            # (no manual-payment proof, no instant-activation claim, recurring
            # checkout never calls one-time Orders). Reads HTML only.
            tests/test_commercial_copy_truth.py
            # Every root page is a complete document (admin.html shipped
            # truncated, its whole script a syntax error). Reads HTML only.
            tests/test_root_pages_complete.py
            # Advisory titles come from the advisory: the STIX re-ingest and the
            # quality hardener never write a cluster label or an invented
            # headline as a title. Imports the two scripts; no network.
            tests/test_advisory_title_integrity.py
            # Evidence chain states KEV / EPSS only when the item proves them
            # (kev == "NO" read as KEV CONFIRMED; EPSS 0.29 read as 29.0%).
            # Imports the enricher; no network.
            tests/test_evidence_chain_truth.py
            # Freshness guard decision table (publisher re-dispatch).
            tests/test_intel_freshness_guard.py
            # F3: the guard's workflow_run triggers name existing workflows,
            # stay on main, and pass no triggering-run data to a step.
            tests/test_intel_freshness_guard_triggers.py
            # Workflow concurrency scoping: derived writers use resource-specific
            # locks; R2/core-feed writers retain the global serialization lock.
            tests/test_workflow_concurrency_scoping.py
            # Severity from a vector-verified CVSS score, EPSS from FIRST.org,
            # and every EPSS renderer on one scale. No network.
            tests/test_severity_epss_truth.py
            tests/test_manifest_sanitizer_fail_closed.py
            # A source article older than INTEL_MAX_SOURCE_AGE_DAYS is not new
            # intel: ingest gate, STIX reconstruction, age, feed guard. No network.
            tests/test_stale_source_guard.py
            # STAGE 5.8.1c: publication-gate 404s and 429s do not stall the
            # convergence check. Fake network and clock; no network.
            tests/test_convergence_gate_rejections.py
            tests/test_pipeline_p0_persistence_and_budget.py
            # Execute generated-output persistence against local Git remotes;
            # PR-policy/push rejection must never produce a green workflow.
            tests/test_convergence_workflow_persistence.py
            # Failed URLhaus fetches are cached in-process; no retry storm.
            tests/test_real_osint_urlhaus_cache.py
            # OpenPhish items link the OpenPhish feed, never the phishing URL.
            # Mocked fetch; no network.
            tests/test_openphish_source_links.py
            # Ingest sanitising never deletes characters from clean text
            # ("WordPress flaw" -> "WordPressflaw"). No network.
            tests/test_encoding_utils_no_char_loss.py
            # Homepage "Last Sync" = feed publication time, not the newest
            # article's date. Reads index.html, evaluates with node.
            tests/test_last_sync_badge_uses_feed_sync.py
            # Reports index lists every report R2 holds (publish state), not
            # only this run's files. Temp dirs; no network.
            tests/test_build_reports_index_published_state.py
            # Catalog entries carry the feed item's CVEs (cve_id/cve_ids/cves).
            tests/test_build_reports_index_cves.py
            # frontend_integrity.py generate rewrites the registry only when a
            # checksum changes (no timestamp-only bot resync commits).
            tests/test_frontend_integrity_no_timestamp_resync.py
            # Homepage design-system CSS extracted from index.html: ?v= is the
            # content hash, paywall rules stay inline, size budget. Local files.
            tests/test_homepage_stylesheet_extraction.py
            # security.txt (RFC 9116): both locations identical and valid,
            # Expires not about to lapse, links and dist wiring. Local files.
            tests/test_security_txt.py
            # Every internal link in every deployed page, and every sitemap
            # URL, resolves to a file dist/ ships. Local files.
            tests/test_site_links_resolve.py
            # External uptime heartbeat for /api/sla/*: probe/replay logic,
            # workflow hardening, and no SLA page defaulting a missing figure
            # to 100%. No network.
            tests/test_sla_heartbeat.py
            # Integrity gate B: placeholder (CDB-UNATTR-*) actor dominance
            # warns, named/synthetic actor dominance still HARD_FAILs.
            tests/test_integrity_gate_actor_entropy.py
            # Public status page shows only measured values: uptime from
            # /api/sla/status, /api/health top-level fields, and probes of
            # routes the Worker serves. Local files.
            tests/test_observability_status_truth.py
            # Customer API console calls only routes the Worker serves, shows
            # no invented metrics, and quotes the limits the Worker enforces.
            tests/test_api_key_manager_truth.py
            # Pages rebuilt on the live feed stay free of invented "live"
            # numbers, random streams and hardcoded IP/ASN attributions.
            tests/test_no_fabricated_intel_pages.py
            # Buyer pages quote only contracted plans and prices; checkout
            # links name plans checkout sells; no URL sets a price. Local files.
            tests/test_contracted_prices_only.py
            # Homepage threat maps: no invented attacks, attributions or
            # telemetry; Genesis attack map never guesses flows. Local files.
            tests/test_threat_map_truth.py
            # GENESIS: one engine, feed-derived figures only; sensors,
            # honeypots and dark-web monitoring reported as not operated.
            # Local files; no network.
            tests/test_genesis_truth.py
            tests/test_bughunter_scan_evidence.py
            tests/test_response_proposal_evidence.py
            tests/test_sovereign_feed_evidence.py
            tests/test_cortex_relationship_evidence.py
            tests/test_quantum_source_evidence.py
            tests/test_engine_input_normalization.py
            tests/test_customer_engine_publication.py
            tests/test_engine_orchestrator_operational_states.py
            tests/test_post_deploy_validator_payloads.py
            # Crawl surface: one robots.txt group with the internal-page
            # Disallows, the Worker report sitemap advertised, reviewed pages
            # in sitemap.xml, share cards on sales pages. Local files.
            tests/test_seo_crawl_surface.py
            # Comparison pages and discount claims: only verified statements;
            # annual discount matches pricing-data.json. Local files.
            tests/test_comparison_claims_truth.py
            # Pages acting on API keys/sessions/payments load js/frame-guard.js
            # first (live static pages carry no X-Frame-Options). Local + node.
            tests/test_clickjacking_guard.py
            # Static-site security headers rule: upsert keeps every other
            # Cloudflare rule, in order; no network.
            tests/test_apply_security_headers_rule.py
            # Compliance and renewal status: no audit, bridge-letter or
            # certification claim beyond "readiness, not attested". Local files.
            tests/test_compliance_status_truth.py
            # Smoke evidence must fail closed and stay outside production data.
            tests/test_hardening_smoke.py
            # EPSS shown on one scale whatever scale the item carries (0-1 or
            # 0-100): no "1816.6%" or "0.09%". Local files + node.
            tests/test_epss_display_scale.py
            # Homepage REPORTS tab loads the catalog: the engine's global
            # cdbSwitchTab calls window.cdbOpenReportsPanel. Local files + node.
            tests/test_reports_tab_wiring.py
            # Plan tables on README.md, trust-center, SLA, compliance, API and
            # security pages equal config/commercial-contract.json; payment goes
            # only through Razorpay/Gumroad; evidence floors stay under the
            # measured values. Local files only.
            tests/test_commercial_claims_convergence.py
            # Report archive floor: a skip at ARCHIVE_MIN_REPORTS exits 0 with
            # a warning instead of failing sentinel-blogger and skipping its
            # post-deploy gates. Temp git repos; no network.
            tests/test_report_archive_floor.py
            # Internal revenue tools rendering invented subscribers, revenue
            # and named contacts stay out of dist/; no shipped page renders
            # invented records. Local files.
            tests/test_dist_fabricated_data_quarantine.py
            # Checkout P0 (2026-10-01): Razorpay the one primary checkout,
            # Gumroad offered only while it can activate access, the assisted
            # note verbatim and no manual-payment mechanism; plus the existing
            # checkout funnel contracts, which no workflow ran before. Local
            # files (+ node for inline-script syntax).
            tests/test_checkout_experience.py
            tests/test_funnel_truth.py
            tests/test_gumroad_and_razorpay.py
            # F24 (2026-10-02): the revenue engine deploy's readiness report
            # names a rejected secret, an edge block or no response instead
            # of "not reachable". Runs the real step with a stub curl.
            tests/test_revenue_readiness_report_step.py
            # F26 (2026-10-02): the premium baseline's shrinkage guard counts
            # only prior items the merge can keep; the baseline persists in
            # R2 around STAGE 3.1.19; premium feed metadata states its real
            # item count. Local files only.
            tests/test_premium_feed_baseline_guard.py
            tests/test_premium_baseline_r2_state_wiring.py
            tests/test_tiered_feed_metadata_truth.py
            # Required-check readiness (2026-10-02): both gates report on every
            # pull request with stable, unskippable check names; the
            # certification's canary step records a failing canary's reason
            # (F28). Local files (+ bash and jq).
            tests/test_regression_gate_required_check_readiness.py
            tests/test_certification_canary_step_records_failures.py
            # P0 R16 exact-head root-cause regression -- mandatory CI execution
            tests/test_p0_r16_preview_contract_scope.py
            tests/test_p0_r16_report_url_proof.py
            tests/test_p0_r16_dedup_before_throttle.py
            # P0 R18 missing evidence must never be presented as observed absence
            tests/test_p0_r18_attack_chain_evidence.py
            # P0 R18: private eight-dossier evidence preflight unit and negative controls
            tests/test_p0_r18_private_evidence_gate.py
            # P0 R19: exact deployed Worker SHA and public publication truth checks
            tests/test_p0_r19_live_release_truth.py
            # P0 R19: do not classify exhausted probes as permanent HTTP 404
            tests/test_convergence_request_budget_regression.py
            # P0 R19: explicit fail-closed empty-feed enrichment controls
            tests/test_p0_r19_empty_public_feed.py
            # R20 zero-network upstream failure release truth
            tests/test_p0_r20_publisher_no_probe_on_upstream_failure.py
            # R20 type-safe v131 multi-CVE upgrade enforcement
            tests/test_p0_r20_v131_multicve_fingerprint.py
            # R22: no loss of canonical inventory from persistent dedup history
            tests/test_p0_r22_manifest_vs_newness_dedup.py
            # P0 R23: standalone public HTML writer must enforce TLP authority
            tests/test_p0_r23_html_report_tlp_authorization.py
            # R24: real registered-source evidence across canonical manifest shapes
            tests/test_p0_r24_source_health_manifest_contract.py
          )
          python3 -m pytest "${SUITES[@]}" -q
          # Refuse to pass having run nothing. pytest.ini forces --verbose, so
          # --collect-only prints a "<N> tests collected" summary rather than
          # nodeids; that summary is what is parsed here.
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "pytest",
               "tests/test_exposure_intel_enricher.py",
               "tests/test_source_fabric_health.py",
               "tests/test_public_freshness_contract.py",
               "tests/test_public_feed_freshness_gate.py",
               "tests/test_deployment_health_contract.py",
               "tests/test_post_rollback_canary.py",
               "tests/test_health_consumer_clock_parity.py",
               "tests/test_orchestrator_freshness_single_authority.py",
               "tests/test_enterprise_pricing.py",
               "tests/test_feed_contract_validator_bounded_preview.py",
               "tests/test_apex_feed_single_producer.py",
               "tests/test_customer_release_label.py",
               "--collect-only", "-q"],
              capture_output=True, text=True).stdout
          m = re.search(r"(\d+) tests? collected", out)
          n = int(m.group(1)) if m else 0
          print(f"collected {n} test(s)")
          if n < 40:
              print(f"::error::expected >=40 collected tests, got {n} -- "
                    "refusing to pass vacuously")
              sys.exit(1)
          PY

      - name: "Operator key issuance compensation"
        run: python3 -m unittest discover -s tests -p test_generate_key_compensation.py -v

      - name: "Regression suite (regression_tests.py)"
        run: python3 scripts/regression_tests.py

      # Mutation proof for the pinned-clock fix: restoring the wall clock in
      # either canary helper, widening the 6h threshold, or making the
      # boundary exclusive must turn the health suites red.
      - name: "Health clock negative controls"
        run: python3 scripts/health_clock_negative_controls.py

      # Buyer-facing copy must match the canonical contract (prices, quotas,
      # no unsupported MSSP tenant allowance) and show the current release.
      # Both previously ran only on manual dispatch, so drift accumulated.
      - name: "Commercial contract drift gate"
        run: python3 scripts/verify_commercial_contract.py

      - name: "Customer-visible release label gate"
        run: python3 scripts/customer_release_label.py

      # Withdrawn social proof (config/evidence-register.json), including
      # claims split across elements. It ran only after merge, on a path list
      # without most buyer pages, plus nightly, so a PR could reintroduce
      # "80+ countries" or a testimonial on demo.html unseen.
      - name: "Unsupported social-proof gate"
        run: python3 scripts/verify_public_claims.py
