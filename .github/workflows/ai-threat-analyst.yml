name: CDB Sentinel APEX  -  AI Threat Analyst v201.0

on:
  schedule:
    - cron: '30 */8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: ai-threat-analyst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ai-analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 1, ref: "${{ github.ref }}"}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install --upgrade pip && pip install requests feedparser networkx && [ -f requirements.txt ] && pip install -r requirements-ci-light.txt || true
      - name: Run AI Threat Analyst
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          MANIFEST_PATH: data/stix/feed_manifest.json
          STIX_DIR: data/stix
          FUSION_DIR: data/fusion
          ZDH_DIR: data/zerodayhunter
          ANALYST_DIR: data/analyst
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent.v37_analyst.analyst_engine
      - name: Preserve generated analyst outputs for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "CYBERDUDEBIVASH"
          git config user.email "bivash@cyberdudebivash.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git diff --cached --quiet
          test -s data/analyst/analyst_report.json
          git add -f -- data/analyst/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "AI Analyst generated outputs for run ${GITHUB_RUN_ID} [skip ci]"
            python scripts/publish_generated_commit.py
          fi
