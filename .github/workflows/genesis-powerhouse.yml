name: CDB GENESIS Intelligence Powerhouse v201.0

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:

# P0 RUNTIME INTELLIGENCE STATE RECOVERY mission (2026-09-10): reduced from
# `write`. This job's only prior use of write access was `git push origin
# main` for data/genesis/ -- rejected by main's branch ruleset on every run
# since ~2026-08-26 (confirmed live: 7 days of "successful" runs, zero
# landed commits), silently downgraded to "Push deferred." by this
# workflow's own retry loop while the step still exited 0. Runtime state
# now persists to Cloudflare R2 (see the "Upload GENESIS state to R2" step
# below) instead -- this job never needs to write to the git repository
# again. See config/workflow_permissions_allowlist.json.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# v184.0 FIX (2026-06-08): Unique concurrency group prevents cancellation by
# other sentinel-data-writer workflows queuing simultaneously.
concurrency:
  group: sentinel-data-writer-genesis
  cancel-in-progress: false

jobs:
  genesis-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1, ref: "${{ github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: mkdir -p data/genesis data/nexus data/cortex data/quantum data/sovereign data/stix
      - name: "Pipeline Lock Check"
        run: |
          if [ -f ".PIPELINE_LOCK" ]; then
            echo "PIPELINE LOCKED - skipping genesis cycle"
            exit 0
          fi
          echo "[OK] No lock active."

      # P0 RUNTIME INTELLIGENCE STATE RECOVERY mission (2026-09-10): GENESIS
      # reads MANIFEST_PATH=data/stix/feed_manifest.json via _entries(), but
      # that file is gitignored (.gitignore:92) and this workflow never
      # populated it -- so _entries() returned [] on every run, independent
      # of the git-push failure this mission also fixes. Same fix as
      # sovereign-platform.yml: read-only consumption of the object
      # sentinel-blogger.yml's existing STAGE 3.5 already keeps fresh in R2
      # (confirmed live via scripts/p0_r2_stix_manifest_diagnostic.py, run
      # 34493014038, 2026-09-10T15:03Z: valid 39-record manifest,
      # last_modified ~1h before that check). --only scopes this to exactly
      # one GET, not the other 21 unrelated STATE_FILES entries.
      - name: Download STIX manifest from R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/r2_state_sync.py --download --only data/stix/feed_manifest.json

      - name: Execute GENESIS 12-Engine Cycle
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent.v43_genesis.genesis_engine

      # P0 RUNTIME INTELLIGENCE STATE RECOVERY mission (2026-09-10)
      # follow-up: identical defect to sovereign-platform.yml's "Run
      # validation tests" step, found via that same live-production
      # verification pass -- pytest was never installed (requirements.txt
      # has no pytest entry either) and `| tail -15` masked the resulting
      # "No module named pytest" failure (no `pipefail`), so this step
      # reported success without ever running a test. Fixed identically:
      # a dedicated install step matching 4 sibling workflows' own
      # regression-gate convention, and no more tail-piping the real exit
      # code away. Verified locally first: the suite genuinely passes --
      # 13/13 -- before letting this step go red on a real failure.
      - run: pip install pytest --quiet

      - name: Validate
        run: python -m pytest tests/test_v43_genesis.py -v --tb=short

      # FAIL-CLOSED (not continue-on-error): proves the orchestrator
      # genuinely executed this run rather than a stale leftover surviving
      # from hours ago. See scripts/validate_intelligence_plane_output.py's
      # header for why a fresh generated_at is a precise, engine-shape-
      # agnostic proxy for "this engine actually ran."
      - name: Validate GENESIS output is non-degenerate
        run: python3 scripts/validate_intelligence_plane_output.py --file data/genesis/genesis_output.json --engine GENESIS

      # FAIL-CLOSED (not continue-on-error): "A swallowed persistence
      # failure is the exact defect being fixed here" (ai-predictions.yml's
      # own established precedent for this exact step shape). Replaces the
      # git add/commit/4-attempt-push-retry block entirely -- that path
      # rejected every push since ~2026-08-26 and this job never needs
      # `contents: write` again.
      - name: Upload GENESIS state to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/r2_state_sync.py --upload --only data/genesis/genesis_output.json,data/genesis/detection_pack.json

      # FAIL-CLOSED (not continue-on-error): independent post-write proof
      # that what is now in R2 actually matches what this run just produced
      # -- a real second GET, not a re-inspection of the same local file the
      # upload step already had. See scripts/r2_round_trip_verifier.py header.
      - name: Verify R2 round trip
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/r2_round_trip_verifier.py --only data/genesis/genesis_output.json,data/genesis/detection_pack.json
