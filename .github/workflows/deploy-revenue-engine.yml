# =============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX -- Revenue Engine Manual-Only Guarded Release
# =============================================================================
# Deploys workers/revenue-engine only after explicit manual release approval.
# Secrets required: CF_API_TOKEN, CF_ACCOUNT_ID (same Cloudflare account/token
# already used by deploy-worker.yml for workers/intel-gateway -- no new
# secrets needed).
#
# Why this file exists: workers/revenue-engine had NO deploy workflow at all
# before this -- deploy-worker.yml is scoped exclusively to
# workers/intel-gateway (see its `paths:` filter). That gap meant this Worker
# could only ever reach production via a manual `wrangler deploy` run from an
# operator's machine (see revenue-crm/DEPLOY.md), with no syntax/bundle
# safety net -- which is how a duplicate top-level function declaration sat
# in this file undetected (it made the Worker fail to bundle entirely).
#
# Scoped deliberately smaller than deploy-worker.yml: this Worker has no
# config/version.json SSOT scheme, no threat-intel data-integrity concerns,
# and no ASCII-enforcement history to carry over. The gates below are the
# ones that are actually meaningful here: syntax validation, a real esbuild
# bundle pre-flight (the exact gate that would have caught the duplicate-
# declaration bug), deploy with the same routes-permission tolerance
# deploy-worker.yml already documents as a known condition on this account,
# and a smoke test against the new /api/health endpoint.
# =============================================================================

name: deploy-revenue-engine v201.0

on:
  workflow_dispatch:
    inputs:
      approved_commit_sha:
        description: 'Exact reviewed 40-character main commit SHA authorized for production'
        required: true
        type: string

permissions:
  contents: read

env:
  WORKER_DIR: workers/revenue-engine

concurrency:
  group: revenue-engine-deploy
  # Never interrupt an in-flight production upload before post-deploy health
  # acceptance. New dispatches wait; each must still prove it targets the
  # current main HEAD immediately before it is allowed to write.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.approved_commit_sha == github.sha

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Node.js 22"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: "Pre-flight: syntax validation (all Worker JS files)"
        run: |
          echo "=== Revenue Engine pre-flight ==="
          echo "--- wrangler.toml ---"
          cat ${WORKER_DIR}/wrangler.toml
          echo ""
          echo "--- node --check ---"
          SYNTAX_FAILED=0
          for jsfile in ${WORKER_DIR}/src/*.js; do
            fname=$(basename "$jsfile")
            node --check "$jsfile" 2>&1 && echo "  OK: $fname syntax valid" || {
              echo "  FATAL: $fname has syntax errors"
              SYNTAX_FAILED=1
            }
          done
          if [ "$SYNTAX_FAILED" -ne 0 ]; then
            echo "FATAL: JS syntax errors found -- aborting deploy"
            exit 1
          fi
          echo "OK: all Worker JS files passed syntax check"

      - name: "GATE — Razorpay Subscriptions lifecycle unit tests (HARD FAIL)"
        # subscription-domain.js (transition state machine) and
        # subscription-engine.js (handleBillingWebhook, the entry point that
        # turns a Razorpay webhook into a real customer's entitlement change)
        # shipped with zero test coverage and no CI gate -- this Worker's
        # deploy pipeline only ever ran a syntax check + bundle pre-flight,
        # neither of which can catch a logic defect in how subscription
        # state transitions gate API-key access. Same node --test pattern
        # deploy-worker.yml already uses for intel-gateway's analogous
        # subscription-lifecycle.test.js trust-boundary gate.
        run: |
          cd ${WORKER_DIR}
          node --test src/__tests__/subscription-domain.test.js src/__tests__/subscription-engine.test.js src/__tests__/revenue-engine-health.test.js src/__tests__/automation-trigger.test.js src/__tests__/payment-submit.test.js src/__tests__/cors.test.js src/__tests__/manual-payment-retirement.test.js src/__tests__/mssp-tenant-fields.test.js src/__tests__/billing-policy.test.js src/__tests__/billing-credit-notes.test.js src/__tests__/billing-export-po.test.js src/__tests__/billing-go-live.test.js src/__tests__/billing-center.test.js src/__tests__/cross-worker-revocation.test.js src/__tests__/commercial-readiness.test.js src/__tests__/pricing-fail-closed.test.js src/__tests__/subscription-webhook-hardening.test.js src/__tests__/renewal-and-key-email.test.js src/__tests__/activation-link.test.js src/__tests__/portal-token-v2.test.js src/__tests__/quote-token-v2.test.js src/__tests__/quote-v2-route-acceptance.test.js src/__tests__/revenue-operator-identity.test.js src/__tests__/revenue-deploy-guard.test.js src/__tests__/revenue-release-attestation.test.js

      - name: "esbuild bundle pre-flight (HARD GATE)"
        # This is the exact check that would have caught the duplicate
        # top-level `getEmailTemplate` declaration that made this Worker
        # unbundleable before this workflow existed. node --check alone does
        # NOT catch this class of error under Node's default module-type
        # detection; esbuild (the real bundler Wrangler uses) does.
        run: |
          echo "=== esbuild bundle pre-flight -- HARD GATE ==="
          npm install -g esbuild@0.25.9
          esbuild --version
          cd ${WORKER_DIR}
          # Bundle the exact entrypoint declared by wrangler.toml. The production
          # security wrapper retires the legacy manual-payment mutations before
          # delegating to index.js, so bundling index.js directly would bypass the
          # control this gate is meant to certify.
          esbuild src/production-entry.js \
            --bundle \
            --platform=browser \
            --target=es2022 \
            --format=esm \
            --outfile=/tmp/revenue_engine_bundle_preflight.js \
            --log-level=warning
          BUNDLE_SIZE=$(wc -c < /tmp/revenue_engine_bundle_preflight.js)
          echo "Bundle size: ${BUNDLE_SIZE} bytes"
          if [ "$BUNDLE_SIZE" -lt 5000 ]; then
            echo "FATAL: Bundle suspiciously small (${BUNDLE_SIZE} bytes) -- possible truncation"
            exit 1
          fi
          rm -f /tmp/revenue_engine_bundle_preflight.js
          echo "=== esbuild pre-flight PASSED -- deploy unblocked ==="

      # Pin legacy Wrangler v3 exactly; the authority gate validates the same
      # CLI with --env production --dry-run before any production write.
      - name: "Install pinned production Wrangler (v3.114.17)"
        run: |
          npm install -g wrangler@3.114.17
          wrangler --version

      # Stamp GitHub's APPROVED exact main SHA into the ephemeral checked-out
      # named-production TOML. Never mutate committed config or use --var,
      # which could drop existing vars and disrupt real customers.
      - name: "Stamp and dry-run exact approved production source SHA"
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${{ inputs.approved_commit_sha }}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          cd ${WORKER_DIR}
          node scripts/stamp-release-sha.mjs "${GITHUB_SHA}" wrangler.toml
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("wrangler.toml","rb"))["env"]["production"]["vars"]["ENGINE_RELEASE_SHA"])')" = "${GITHUB_SHA}"
          wrangler deploy --env production --dry-run

      # A manually approved SHA can become stale while a workflow is queued
      # or performing dry-runs. Refuse the write when main has advanced; do
      # not deploy an older checkout after a newer P0 fix was merged.
      - name: "Verify approved SHA is still main immediately before production write"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          CURRENT_MAIN="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ -z "$CURRENT_MAIN" ] || [ "$CURRENT_MAIN" != "${GITHUB_SHA}" ]; then
            echo "::error title=Release superseded::Approved SHA is no longer main HEAD, or main cannot be verified. Start a newly reviewed workflow for the current main commit."
            exit 1
          fi
          echo "Approved source SHA is still main HEAD; deploy may proceed."

      # Only the explicitly authorized production target may be updated. A
      # failed --env production deploy is NOT permission to retry the unnamed
      # default environment, even if the two currently share a Worker name.
      - name: "Deploy Worker to approved production environment (no fallback)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd ${WORKER_DIR}
          LOG=/tmp/wrangler_deploy.log
          echo "Deploying sentinel-revenue-engine with --env production only"
          if wrangler deploy --env production > "$LOG" 2>&1; then
            cat "$LOG"
            echo "Production deploy command returned success; verifying public health next."
          else
            cat "$LOG"
            if grep -Eqi 'workers/routes|custom_domain|custom domain' "$LOG"; then
              echo "::error title=Cloudflare route authorization needs review::Named production deployment did not complete successfully. Review least-privilege route permissions; do not assume an existing HTTP 200 proves new code is deployed."
            fi
            echo "::error title=Fail-closed production deploy::Named production deploy returned a nonzero status. No unnamed/default environment fallback is permitted."
            exit 1
          fi

      # Health must identify the approved source SHA served at the public
      # route. This validates the Worker-reported release config claim, not a
      # cryptographic hash of the bundled script or Cloudflare's deployment ID.
      - name: "Post-deploy public health acceptance gate (HARD FAIL)"
        run: |
          set -euo pipefail
          cd ${WORKER_DIR}
          EXPECTED_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("wrangler.toml","rb"))["env"]["production"]["vars"]["ENGINE_VERSION"])')
          test -n "$EXPECTED_VERSION"
          HEALTH_FILE=/tmp/revenue_health_public.json
          for attempt in 1 2 3 4 5 6; do
            echo "Public health acceptance attempt ${attempt}/6"
            if curl -fsS --max-time 15 "https://revenue.intel.cyberdudebivash.com/api/health" -o "$HEALTH_FILE" &&
               node scripts/verify-public-health.mjs "$HEALTH_FILE" "$EXPECTED_VERSION" "$GITHUB_SHA"; then
              echo "Public health accepted: HTTP 200, exact engine, declared version, and approved source SHA."
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Production health gate failed::Live public health could not confirm expected engine, version and exact approved SHA. Do not mark deployment successful."
          exit 1

      # S13/S22: commercial go-live verdict after each deploy (READY/BLOCKED,
      # blocker and warning ids, operator queue size -- never secret values).
      # Informational: runs only when the REVENUE_ADMIN_SECRET repository
      # secret exists, never fails the deploy.
      #
      # F24 (2026-10-02): this step printed "readiness endpoint not reachable
      # yet" on every deploy (runs 36460344094, 36914355894) while the route
      # answered 401 without the secret: `curl -sf` dropped the status, so a
      # rejected secret, a network error and an edge block all read the same.
      # It now records the HTTP status, retries only 5xx / no response, and
      # names the cause. Still informational and never prints the secret.
      - name: "Commercial readiness report"
        continue-on-error: true
        env:
          REVENUE_ADMIN_SECRET: ${{ secrets.REVENUE_ADMIN_SECRET }}
        run: |
          if [ -z "${REVENUE_ADMIN_SECRET:-}" ]; then
            echo "REVENUE_ADMIN_SECRET repository secret not set -- skipping readiness report."
            echo "::warning title=Commercial readiness not reported::The REVENUE_ADMIN_SECRET repository secret is not set, so this deploy cannot show the commercial readiness verdict."
            exit 0
          fi
          URL="https://revenue.intel.cyberdudebivash.com/api/v2/billing/admin/readiness"
          BODY=$(mktemp)
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 15 \
                     -H "X-Admin-Secret: ${REVENUE_ADMIN_SECRET}" "$URL" 2> /dev/null) || code=000
            case "$code" in
              5??|000) [ "$attempt" -lt 3 ] && sleep $((attempt * ${READINESS_RETRY_SLEEP_SECONDS:-10})) ;;
              *) break ;;
            esac
          done
          echo "Readiness endpoint: HTTP $code (attempt $attempt of 3)"
          python3 - "$code" "$BODY" "$URL" <<'PY'
          import json, sys
          code, path, url = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              body = json.load(open(path, encoding="utf-8"))
          except Exception:
              body = None
          title = "::warning title=Commercial readiness not reported::"
          if code == "200" and isinstance(body, dict) and "verdict" in body:
              q = body.get("queue") or {}
              print("verdict:", body.get("verdict"), "| blockers:", body.get("blockers"), "| warnings:", body.get("warnings"), "| operator queue:", q.get("attention"))
              if body.get("verdict") != "READY":
                  print("::warning title=Commercial readiness: " + str(body.get("verdict")) + "::Blockers: " + ", ".join(body.get("blockers") or []))
          elif code in ("401", "403") and isinstance(body, dict) and body.get("error") == "unauthorized":
              print(title + f"HTTP {code}: the revenue engine rejected the REVENUE_ADMIN_SECRET repository secret. It does not match the Worker's REVENUE_ADMIN_SECRET; set both to the same value (the billing canary's admin mode needs it too).")
          elif code in ("401", "403"):
              print(title + f"HTTP {code} did not come from the revenue engine (no JSON error body): the request was blocked before the Worker, for example by an edge or WAF rule.")
          elif code == "000":
              print(title + f"No HTTP response from {url} after 3 attempts (network error or timeout).")
          else:
              print(title + f"HTTP {code} from the readiness endpoint.")
          PY
