# =============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX -- Fast, Independent Frontend Publisher
# =============================================================================
# ROOT CAUSE FIX (P0, 2026-09-01): sentinel-blogger.yml's own "STAGE 5 - Deploy
# to GitHub Pages" is step 133 of ~162 sequential stages in ONE monolithic job
# (concurrency group `sentinel-data-writer`, cancel-in-progress: false). A full
# run legitimately takes 2-3+ hours -- confirmed live: run #2202 (triggered by
# commit a9ccb05's push) needed 65 stages / ~32 minutes just to reach STAGE 3.5
# of ~162 total. Because that concurrency group never cancels an in-progress
# run, every commit during a busy period (15+ commits landed in a few hours on
# 2026-09-01) queues up strictly behind it, one at a time -- so a plain
# index.html change (a CSS tweak, a UI fix, a security-header hardening pass)
# can sit fully merged and correct in git, yet invisible on the live site for
# hours, waiting behind unrelated, much slower data-enrichment/certification
# stages it has nothing to do with. That is exactly what happened to the
# threat-map/demo-video feature (#299) and the CSP hardening (#300): both were
# git-perfect immediately, but stuck live for hours because they were queued
# behind that single 162-stage run.
#
# FIX: publish the CURRENT git-committed state of the static frontend
# (index.html + its protected JS/CSS + _headers) to GitHub Pages via its own
# small, independent workflow -- own concurrency group, own policy
# (cancel-in-progress: true, since every run just republishes current git
# state; a newer commit's run should always supersede a stale in-flight one,
# unlike sentinel-data-writer's sequential enrichment work where state
# actually accumulates run over run) -- with nothing to wait behind.
#
# This does NOT replace sentinel-blogger.yml's own deploy step, which remains
# the authoritative path for reports/, api/, dashboard/, customer/, assets/,
# and everything else build_dist_artifact.py packages on its normal cadence.
# It is a narrow, additive safety net specifically for the handful of files
# that make up the live dashboard's own code, so a UI or security fix is never
# again hostage to an unrelated multi-hour data-pipeline queue.
#
# ADDITIVE FIX (P0, issue #320, 2026-09-02): this workflow's own on.push
# trigger has now failed to fire on 3 consecutive PR-merge commits (#314,
# #315, #317) -- see deploy-drift-watchdog.yml's header for the full
# evidence chain (two other filterless on.push workflows showed the same
# gap; GitHub's own CodeQL scan fired fine on the same pushes; converging
# evidence points at API/App-mediated PR-merge pushes not reliably
# triggering user-defined on.push workflows in this repo/org). The
# watchdog closes that gap within ~15 minutes; this trigger tries to close
# it immediately, and by a different mechanism than the one suspected
# unreliable: `pull_request` events are fired by GitHub's PR state
# machine as part of the merge operation itself, not by a subsequent git
# push-webhook delivery -- an architecturally different path than `push`,
# not a retry of the same one. If this repo/org's suppression turns out
# to also affect `pull_request` delivery, the watchdog remains as a
# bounded-time safety net; if it doesn't, this closes the gap with zero
# delay instead of ~15 minutes. Either way this is a pure addition: the
# existing `push` and `workflow_dispatch` triggers, and everything below
# them, are unchanged. A near-simultaneous double-fire (e.g. push
# delivery works sometimes) is already handled safely by this workflow's
# existing `concurrency: cancel-in-progress: true` below -- both runs
# would build+deploy the identical current-main content, so the second
# to start simply supersedes the first, exactly the "a newer run
# supersedes a stale one" behavior this workflow already relies on.
#
# REUSE (Principle 4 -- searched before building): calls the exact same
# scripts/build_dist_artifact.py and the same pinned
# JamesIves/github-pages-deploy-action config that sentinel-blogger.yml's
# STAGE 5.4.6/STAGE 5 already use -- not a reimplementation. Also reuses
# scripts/pages_deploy_freshness_gate.py (STAGE 5.4.9.1) unchanged -- it
# polls the live site's Last-Modified header against a pre-deploy timestamp
# and has no dependency on reports/ or any other pipeline-specific state, so
# it's equally valid here as the guard against the *other* known failure mode
# (GitHub's own Pages backend silently stuck in `deployment_queued` -- see
# TITAN_PAGES_DEPLOYMENT_INCIDENT_2026-08-06.md).
#
# Deliberately NOT reusing STAGE 5.4.7's dist_artifact_verifier.py: its
# report-count/report-url checks assume reports/ was just freshly generated
# by the ~130 preceding enrichment stages this workflow deliberately skips
# (reports/ is gitignored and does not exist in a plain checkout --
# build_dist_artifact.py's own copy_reports_selective() already handles a
# missing reports/ gracefully, returning 0 files copied rather than failing).
# Running the full verifier here would hard-fail every single run on a
# guarantee this workflow was never meant to make. The step below checks
# only what this workflow *does* guarantee: the frontend files it was
# triggered to publish are actually present and non-empty in dist/.
# =============================================================================

name: pages-fast-publish

on:
  push:
    branches: [main]
    paths:
      # GAP FIX (found auditing this workflow for global-customer readiness,
      # 2026-09-01): the original enumerated list only covered the specific
      # files touched by #299/#300. index.html actually loads 8 more local JS
      # files this list missed entirely -- js/engines/*.js (6 files),
      # js/metric-normalize.js, and js/sentinel-live-feeds.js (documented as
      # "COMPLETE FRONTEND FIX -- All dashboard widgets wired to live API":
      # stats bar, threat gauge, live feed preview, heatmap, kill-chain
      # activity). A fix landing in any of those would have silently gone
      # back to being queued behind the 162-stage pipeline for hours --
      # recreating this exact P0 for the file most central to it. Directory
      # globs instead of an enumerated list so this can't drift out of sync
      # again as new frontend files are added. build_dist_artifact.py's
      # INCLUDE_DIRS copy of js/ and css/ is already a full recursive
      # shutil.copytree (verified: EXCLUDE_PATTERNS only blocks __pycache__,
      # .git, .env, *.log, *.pdf), so no build-side change is needed --
      # only this trigger list was incomplete.
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - '_headers'
      # GAP FIX (2026-09-01, found while adding the stale-service-worker
      # client-side recovery below): service-worker.js sits at repo root, so
      # it matched none of the globs above -- a fix landing there alone would
      # have silently gone back to being queued behind the 162-stage
      # pipeline for hours, the exact failure mode this file's own header
      # comment already documents fixing for index.html/js/css/_headers.
      - 'service-worker.js'
      # GAP FIX (P0 first-revenue mission, found live: PR #444 and #445, both
      # pricing.html-only or pricing.html+lead-pipeline.html+enterprise-
      # onboarding.html diffs, merged to main and neither triggered this
      # workflow -- confirmed via workflow run history, no run exists between
      # #77 (PR #435's merge) and the manual workflow_dispatch that finally
      # published them). Root cause: `index.html` above is a single literal
      # filename, not a glob, so no OTHER root-level HTML page -- pricing.html,
      # mssp.html, upgrade.html, lead-pipeline.html, enterprise-onboarding.html,
      # every buyer-facing page this repo's own commercial gates sweep -- was
      # ever covered by this trigger. This is the exact same gap class this
      # file has already found and fixed twice above (js/engines/*.js, then
      # service-worker.js): a file central to fast frontend publishing sat
      # outside the enumerated list. build_dist_artifact.py's own
      # INCLUDE_FILES_PATTERN already copies `*.html` (verified: line ~108) --
      # only this trigger's path filter had not kept pace with what the build
      # already ships. Replacing the single-file entry with the same
      # directory-glob philosophy already used for js/** and css/** so this
      # can't drift out of sync again as new root-level pages are added.
      - '*.html'
  # ADDITIVE FIX (issue #320, see header comment above): identical paths
  # list to the push trigger above -- only fires when a merged PR actually
  # touched one of these files, matching that trigger's own scoping intent
  # exactly (GitHub evaluates pull_request paths: filters against the PR's
  # actual changed files, including for the `closed` event).
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - '_headers'
      - 'service-worker.js'
      - '*.html'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-fast-publish
  # Opposite of sentinel-data-writer's cancel-in-progress: false -- that
  # pipeline accumulates enrichment state run over run, so it must never
  # cancel a run mid-flight. This workflow only ever republishes whatever is
  # currently on main; a newer commit's run fully supersedes an older one, so
  # letting a stale in-flight run keep the lock and delay the newer commit's
  # publish would recreate the exact queueing problem this workflow exists to
  # avoid.
  cancel-in-progress: true

jobs:
  publish:
    name: Fast-publish frontend to GitHub Pages
    # SECURITY (CWE-863, flagged in PR #303 review): workflow_dispatch lets a
    # caller pick any branch/tag to check out and deploy with this job's
    # pages:write/contents:write token. Restrict actual execution to main so
    # a manual dispatch against a feature branch can't publish unreviewed
    # content live -- push events already only fire on main, so this is a
    # no-op for that trigger and doesn't affect the intended manual-dispatch
    # use (dispatching with ref: main).
    #
    # EXTENDED (issue #320): github.ref for a pull_request event is a PR
    # merge/head ref (e.g. refs/pull/316/merge), never refs/heads/main, so
    # the check above needs a second clause for the new trigger rather than
    # matching it by accident. Guards on both the PR actually having been
    # merged (types:[closed] alone also fires on close-without-merge) and
    # its base branch being main (branches:[main] above already restricts
    # this, checked again here defense-in-depth since this line is what
    # actually authorizes the deploy).
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # EXTENDED (issue #320): a pull_request event has no meaningful
          # github.ref to check out (see the job-level `if` comment above) --
          # this workflow's entire design is "republish whatever is
          # currently on main" (see header comment), so explicitly check out
          # main's current HEAD (the just-landed squash-merge commit) for
          # that one event type; push and workflow_dispatch keep their
          # existing, unchanged behavior via github.ref.
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build dist/ artifact (reuses build_dist_artifact.py -- same script as sentinel-blogger.yml STAGE 5.4.6)
        env:
          REPORT_RETENTION_DAYS: "3"
        run: python3 scripts/build_dist_artifact.py

      - name: Verify frontend-critical files are present in dist/
        run: |
          missing=0
          for f in index.html js/api_adapter.js js/card_renderer.js js/card_renderer_integration.js js/sla-monitor.js js/sentinel-live-feeds.js css/card_renderer_styles.css _headers .nojekyll; do
            path="dist/$f"
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty required file in dist/: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "FATAL: dist/ is missing frontend-critical files -- refusing to deploy a broken artifact." >&2
            exit 1
          fi
          echo "OK: all frontend-critical files present in dist/"

      # PR #304 follow-up: the file-presence check above confirms the right
      # files exist in dist/; it does not confirm the page actually renders
      # without error. Before this fix, a broken JS file (syntax error, a
      # runtime TypeError on load) would reach production in ~90 seconds
      # with nothing here to catch it -- the post-deploy freshness gate only
      # confirms the deploy landed, not that it works. Reuses the exact
      # headless-Chromium/local-static-server pattern this repo already
      # established in render-test/verify_enterprise_homepage.js, scoped
      # down to a pass/fail render check (no accessibility/contrast
      # assertions -- out of scope for a pre-deploy gate).
      - name: Setup Node.js 22 (smoke-test dependency)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Playwright (Chromium only, smoke-test dependency)
        # Not a project dependency (this is a Python-first repo -- see
        # docs/enterprise-homepage-guide.md, Known Limitations, for why no
        # package.json/node_modules is committed for this); installed fresh
        # here with --no-save so nothing is written back to the checkout.
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Pre-deploy smoke test (headless-browser render check)
        run: node render-test/verify_pages_fast_publish_smoke.js dist

      # P0 FIX (2026-09-01): the smoke test above only fails on a thrown JS
      # error or a 404 on an owned path -- it never looks at what actually
      # painted. #cdb-threat-canvas (homepage threat map, #299) has a long
      # documented history (index.html's RC1-RC13 / v159-v186 governance CSS
      # comments) of going silently blank on real Chrome from a GPU
      # compositor trap that throws no error and 404s nothing -- invisible
      # to the check above, which is exactly how that one panel reached
      # production broken 13+ times. This gate samples actual canvas pixel
      # content and asserts the governed CSS properties RC1-RC13 traced the
      # trap to, through the new (#299) fullscreen-toggle and tooltip code
      # specifically, plus the demo-video click-to-play path (#299/#309)
      # and the #apex-lead-modal Escape/backdrop-click fix landed alongside
      # this gate. See render-test/verify_threat_map_chrome_render.js for
      # the full rationale. Additive: a second, narrower gate alongside the
      # one above, not a replacement.
      - name: Pre-deploy threat-map / demo-video render check (headless-browser)
        run: node render-test/verify_threat_map_chrome_render.js dist

      # P0 FIX (2026-09-01): reported live as "Chrome customers blocked --
      # all threat intel/feeds/reports fail to show and sync, dashboard
      # empty". Matches a live incident this repo's own commit history
      # already documents: a customer's browser stuck on a broken/outdated
      # service worker intercepting /api/* with empty responses while the
      # real API was healthy. That fix (updateViaCache:'none' + a
      # visibilitychange re-check, service-worker.js v175/v176) makes the
      # browser's own update *check* more reliable, but reproduced with a
      # scripted harness: it does not guarantee an already-stuck browser
      # recovers promptly (the new SW can sit in `waiting` across several
      # real reloads without taking control). The actual fix is a
      # client-side one in loadGOCIntel()'s terminal failure branch:
      # unregister + clear caches + reload once, session-guarded, if a
      # service worker is controlling the page when every manifest source
      # has failed -- doesn't depend on SW update timing at all. See
      # render-test/verify_stale_service_worker_recovery.js for the full
      # rationale and the harness that proves it.
      - name: Pre-deploy stale-service-worker recovery check (headless-browser)
        run: node render-test/verify_stale_service_worker_recovery.js dist

      # STAGE 2 (SENTINEL APEX Dynamic Frontend Transformation, 2026-09-01):
      # proves the EICC panel's zero-fabrication fixes (fillAIPredictions'
      # hardcoded fake predictions + false ONLINE claim, fillMetrics' "74"/
      # "LIVE" fallbacks, buildTicker/buildFeedPreview's stuck-loading state
      # on total fetch failure) and the new js/apex-data-plane.js-routed
      # fetch cascade's rendering-security escaping, against the real page --
      # see render-test/verify_eicc_zero_fabrication_states.js for the full
      # rationale.
      - name: Pre-deploy EICC zero-fabrication + rendering-security check (headless-browser)
        run: node render-test/verify_eicc_zero_fabrication_states.js dist

      # STAGE 2 (SENTINEL APEX Dynamic Frontend Transformation, 2026-09-01):
      # js/__tests__/*.test.js (Node's built-in test runner, no extra
      # dependency) already existed -- api_adapter/dashboard_contract_validator/
      # dashboard-state/metric-normalize/index_html_* coverage, 118 tests --
      # but was not wired into any CI workflow (confirmed: no reference to
      # js/__tests__ anywhere under .github/workflows/ before this change),
      # so a real regression in any of those already-tested modules could
      # reach production undetected. Additive: a new gate alongside the
      # render-test ones above, reusing the exact `node --test` invocation
      # this repo's own backend workflows already use (deploy-worker.yml,
      # deploy-revenue-engine.yml), not a new test-running mechanism.
      - name: Pre-deploy JS unit test suite (js/__tests__/, node --test)
        run: node --test js/__tests__/*.test.js

      # v184.1-style pattern (see sentinel-blogger.yml STAGE 4.9.9): captured
      # immediately before the push so the freshness gate below can verify
      # the live site actually picked up THIS run's deploy.
      - name: Capture pre-deploy timestamp
        id: pre-deploy-ts
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages (same action + config as sentinel-blogger.yml STAGE 5)
        # Pinned to the same commit SHA as sentinel-blogger.yml's STAGE 5 --
        # this job holds pages:write and pushes to gh-pages, so a re-pointed
        # floating tag would deploy arbitrary content to the live Pages site
        # with this token.
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          # CRITICAL (flagged in PR #303 review): reports/, api/, customer/,
          # and assets/ are build_dist_artifact.py INCLUDE_DIRS,
          # but this workflow's fresh checkout never populates them the way
          # the full pipeline does -- most notably api/feed.json and
          # /reports/ are deliberately gitignored (served via Cloudflare
          # R2/Worker, not git; see .gitignore's SECURITY v109 and
          # RC-GITIGNORE-1 notes) and are simply absent from this run's
          # dist/. Without this exclusion, clean:true's rsync --delete would
          # remove the live gh-pages copies of those paths on every
          # fast-publish run -- reintroducing the exact "No Threat
          # Intelligence Available" P0 this whole workflow exists to
          # prevent, and doing it more often. None of these paths are in
          # this workflow's trigger list above, so it never owned them;
          # scope clean to exactly what it publishes.
          #
          # .well-known/ REMOVED from this list (P0, 2026-09-06): unlike the
          # paths above, it is not gitignored or partially populated --
          # it's a single small, fully git-tracked file (security.txt) this
          # workflow's checkout always has complete. Excluding it from clean
          # meant a change to it could never actually deploy via this
          # workflow: build_dist_artifact.py copied the fresh file into
          # dist/ every run, but clean-exclude told the deploy action to
          # leave gh-pages's existing copy untouched regardless. Confirmed
          # live: a security.txt fix committed to main and published via
          # this exact workflow twice never appeared on gh-pages -- the
          # deployed blob hash matched the pre-fix commit verbatim. The
          # other five paths were not re-verified against the same failure
          # mode at that time and were left as-is.
          #
          # dashboard/ REMOVED from this list (P0, 2026-09-06): confirmed
          # live via the exact same method as .well-known/ above, while
          # independently verifying this same day's PR #382 deployment --
          # dashboard/enterprise_dashboard_v2.html (fully git-tracked, not
          # gitignored, present in build_dist_artifact.py's dist/ output
          # every run, same as every other file under dashboard/) had a
          # commercial-integrity fix committed to main and published via
          # this exact workflow, yet the live page still served the
          # pre-fix content verbatim. Same root cause, same fix. The
          # remaining four paths (reports/, api/, customer/, assets/) are
          # still not re-verified against this failure mode and are left
          # as-is -- each has the gitignored/partial-checkout justification
          # above, which dashboard/ never had.
          clean-exclude: |
            reports/**
            api/**
            customer/**
            assets/**
          single-commit: true

      - name: Post-deploy freshness verification (reuses pages_deploy_freshness_gate.py -- STAGE 5.4.9.1)
        timeout-minutes: 14
        env:
          PLATFORM_URL: https://intel.cyberdudebivash.com
          PRE_DEPLOY_TIMESTAMP: ${{ steps.pre-deploy-ts.outputs.ts }}
        run: python3 scripts/pages_deploy_freshness_gate.py
