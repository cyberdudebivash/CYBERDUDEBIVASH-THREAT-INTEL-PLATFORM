name: "SENTINEL APEX -- Storage Governance v201.0"

# Scheduled storage governance: prune old artifacts, archive historical data,
# run telemetry collection for enterprise observability dashboards

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Governance mode"
        required: true
        type: choice
        options: [dry-run, execute]
        default: dry-run

concurrency:
  group: sentinel-storage-governance
  cancel-in-progress: false

permissions:
  # P0 (2026-09-10, public-repo zero-trust): narrowed from a workflow-wide
  # contents: write. Of this workflow's 3 jobs, only `storage-prune`
  # (git add + commit + push of data/telemetry/, data/governance/) writes
  # to git; `telemetry-collection` and `storage-scan` only run Python
  # scripts that print reports/alerts, never touching git. storage-prune
  # now declares its own job-level contents: write below instead.
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GIT_AUTHOR_NAME: "SENTINEL APEX Storage Governance"
  GIT_AUTHOR_EMAIL: "actions@github.com"
  GIT_COMMITTER_NAME: "SENTINEL APEX Storage Governance"
  GIT_COMMITTER_EMAIL: "actions@github.com"

jobs:

  telemetry-collection:
    name: "Enterprise Telemetry Collection"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: "Set up Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: "Run enterprise telemetry collection"
        timeout-minutes: 8
        run: |
          echo "[TELEMETRY] Starting collection pass..."
          python3 scripts/enterprise_telemetry.py collect 2>&1 | tee /tmp/telemetry_output.txt
          echo "[TELEMETRY] Collection complete"

      - name: "Print telemetry report"
        run: |
          python3 scripts/enterprise_telemetry.py report 2>&1 || true

      - name: "Anomaly alert if detected"
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python3 scripts/print_anomaly_alert.py
  storage-scan:
    name: "Storage Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: "Set up Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: "Run storage scan"
        run: |
          python3 scripts/storage_governance.py scan 2>&1

  storage-prune:
    name: "Storage Prune"
    runs-on: ubuntu-latest
    needs: [storage-scan]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: "Set up Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: "Run storage prune"
        run: |
          MODE="${{ github.event.inputs.mode || 'dry-run' }}"
          if [ "$MODE" = "execute" ]; then
            echo "[PRUNE] Executing storage prune..."
            python3 scripts/storage_governance.py prune --execute 2>&1
          else
            echo "[PRUNE] Dry-run storage prune..."
            python3 scripts/storage_governance.py prune 2>&1
          fi

      - name: "Archive old data (dry-run only for safety)"
        run: |
          python3 scripts/storage_governance.py archive 2>&1

      - name: "Commit telemetry data if changed"
        if: github.event.inputs.mode == 'execute'
        timeout-minutes: 5
        run: |
          git config user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git add data/telemetry/ data/governance/ || true
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit"
          else
            git commit -m "chore: storage governance + telemetry update [skip ci]" || true
            # v184.3 FIX: `git push ... || true` previously swallowed push
            # failures unconditionally, and "Telemetry data committed" printed
            # regardless of whether the push actually succeeded -- a remote-
            # ahead/network/permission failure would silently drop the commit
            # with zero visible signal anywhere in the run. One retry after a
            # fetch+rebase (telemetry data has no meaningful merge conflicts to
            # resolve manually), then a real, visible error if that also fails.
            if git push origin main; then
              echo "Telemetry data committed and pushed."
            elif git fetch origin main && git rebase origin/main && git push origin main; then
              echo "Telemetry data committed and pushed (after rebase retry)."
            else
              echo "::error::Failed to push telemetry/governance commit to main after retry -- data was NOT persisted upstream."
              exit 1
            fi
          fi
