          fi

      # -----------------------------------------------------------------------
      # STAGE 3.1.21: DETECTION PACK GENERATOR (v185.0 — ENTERPRISE SUITE)
      # Generates detection engineering products from certified baseline:
      #   data/premium_staging/detections/sigma_rules.yml     — Sigma rules (SIEM-ready)
      #   data/premium_staging/detections/kql_queries.kql     — KQL queries (Sentinel/Defender)
