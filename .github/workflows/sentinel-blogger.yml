      # ensures the primary dashboard data source carries confidence + SLA data.
      # STAGE 3.5 (R2 upload) also runs post-this step, so R2 gets full CTI labels.
      #
      # Non-blocking: continue-on-error keeps pipeline safe on any edge failure.
