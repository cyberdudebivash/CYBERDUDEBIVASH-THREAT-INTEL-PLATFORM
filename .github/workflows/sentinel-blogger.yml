      # Dual-source guarantee: Source-1 = api/feed.json (live enriched)
      #                        Source-2 = api/feed.baseline.json (certified fallback)
      # Both sources are premium, verified, and sellable at maximum value.
      # Non-blocking: baseline failure never fails the pipeline.
      # -----------------------------------------------------------------------
      - name: "STAGE 3.1.19 - Premium Feed Baseline Engine (v185.0 — dual-source)"
        timeout-minutes: 3
        continue-on-error: true
        env:
