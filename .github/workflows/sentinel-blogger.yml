      #   api/feed.trial.json                      — TRIAL (FREE→CTA)       Top 10 redacted
      # v184.4 FIX: the four paid tiers write to a gitignored staging path and
      # upload to R2 instead of api/feed.*.json, which was PUBLIC in this git
      # repo with no entitlement check anywhere. Only TRIAL (the intended
      # public teaser) still writes into api/.
      # v184.6 FIX: uploads now reuse the job-level CF_ACCOUNT_ID/
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (already set above, same
      # credentials scripts/r2_upload.py uses) and write into the existing
