      #   data/responses/response_log.json   — TIP+SOAR response log
      #   data/threathunts/hunts.json        — Threat hunt hypotheses
      #   api/ai/tracker.json                — AI Cyber Brain tracker
      #   api/engines.json                   — Engines API manifest
      # P0 RUNTIME INTELLIGENCE STATE RECOVERY mission follow-up (PR #409):
      # NEXUS/GENESIS/CORTEX/QUANTUM/SOVEREIGN are deliberately NOT in this
