            BASELINE_COUNT=$(jq 'length' api/feed.baseline.json 2>/dev/null || echo "?")
            echo "[PASS] Premium baseline certified: ${BASELINE_COUNT} verified items written to api/feed.baseline.json"
            echo "::notice::DUAL-SOURCE: api/feed.baseline.json updated with ${BASELINE_COUNT} premium items"
          else
