name: CDB Sentinel APEX  -  Convergence v201.0

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# Resource-scoped lock: this workflow reads shared intelligence but writes only
# its own derived namespace. A global sentinel-data-writer lock can starve or
# cancel pending jobs because GitHub concurrency retains only one pending run.
concurrency:
  group: sentinel-data-writer-convergence
  cancel-in-progress: false

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 1, ref: "${{ github.ref }}"}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install --upgrade pip requests feedparser networkx && [ -f requirements.txt ] && pip install -r requirements-ci-light.txt || true
      - name: Run Convergence Engine
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          MANIFEST_PATH: data/stix/feed_manifest.json
          STIX_DIR: data/stix
          FUSION_DIR: data/fusion
          ZDH_DIR: data/zerodayhunter
          OMNISHIELD_DIR: data/omnishield
          CONVERGENCE_DIR: data/convergence
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent.v37_convergence.convergence_engine
      - name: Preserve generated convergence artifacts for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "CYBERDUDEBIVASH"
          git config user.email "bivash@cyberdudebivash.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          git add -f data/convergence/
          if git diff --cached --quiet; then
            echo "No convergence artifact changes"
          else
            RULES=$(python3 -c "import json; d=json.load(open('data/convergence/convergence_report.json')); print(d['integration_stats']['detection_rules'])")
            git commit -m "CONVERGENCE v37.0 - ZDH Integration | ${RULES} detection rules [skip ci]"
            python scripts/publish_generated_commit.py
          fi

