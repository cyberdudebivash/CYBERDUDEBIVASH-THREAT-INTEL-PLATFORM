# SENTINEL APEX -- Apply static-site security headers (Cloudflare Transform Rule)
#
# The static site is GitHub Pages behind Cloudflare, so _headers never reaches
# a browser: verified live 2026-09-28, every page (upgrade.html checkout
# included) is served with HSTS only -- no X-Frame-Options / CSP
# frame-ancestors, X-Content-Type-Options, Referrer-Policy or
# Permissions-Policy. /api/* already gets them from the gateway Worker.
#
# cloudflare/security_headers_transform_rule.json is the fix (header-level,
# no Worker in the request path, no change to any page). This workflow applies
# it through scripts/apply_security_headers_rule.py:
#   plan   -> print the rule list apply would write (changes nothing)
#   apply  -> back up the zone's http_response_headers_transform entrypoint
#             (uploaded as an artifact), upsert ONLY this rule, keep every
#             other rule and its order, then verify live headers
#   verify -> check live headers only
#
# Manual only (workflow_dispatch): changing zone-wide response headers is a
# deliberate production action, never a side effect of a merge.
# Needs secrets.CF_API_TOKEN with Zone:Read and Zone Transform Rules:Edit on
# cyberdudebivash.com; plan fails clearly if the token lacks them.
#
# Rollback: re-run nothing -- restore the uploaded backup artifact's "rules"
# with the Rulesets API, or delete the one rule in the dashboard
# (Rules -> Transform Rules -> Modify Response Header).

name: apply-security-headers v201.0

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (no change) | apply | verify"
        required: true
        default: plan
        type: choice
        options: [plan, apply, verify]

permissions:
  contents: read

concurrency:
  group: apply-security-headers
  cancel-in-progress: false

jobs:
  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Rule and merge tests (HARD GATE)
        run: |
          pip install pytest --quiet
          python -m pytest tests/test_apply_security_headers_rule.py tests/test_clickjacking_guard.py -q

      - name: Run (${{ inputs.mode }})
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: python scripts/apply_security_headers_rule.py "$MODE" --backup "$RUNNER_TEMP/security-headers-entrypoint-backup.json"

      - name: Upload entrypoint backup
        if: always() && inputs.mode == 'apply'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-headers-entrypoint-backup
          path: ${{ runner.temp }}/security-headers-entrypoint-backup.json
          if-no-files-found: ignore
          retention-days: 90
