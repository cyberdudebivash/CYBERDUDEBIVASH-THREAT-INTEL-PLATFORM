# ============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX -- SBOM Generation
# v47.7 -- P0 fix: Restore 3-attempt retry (30/60s backoff) around the
#          v47.6 Anchore download-syft/download-grype actions -- confirmed
#          live (run #339) that those actions have no retry logic of their
#          own and fail immediately on a single transient HTTP 503 from
#          GitHub's release-asset CDN. Implemented via GitHub Actions'
#          native continue-on-error + conditional-step retry idiom, since
#          `uses:` steps cannot be wrapped by nick-fields/retry (verified:
#          shell-command-only) or looped inline in bash.
#
# BUG FIX HISTORY:
#
# v47.2 (commit 6b898a4):
#   cyclonedx-bom==4.4.3 removed the --output-file flag.
#   Fix: Remove --output-file; redirect stdout with >.
#
# v47.3 -- Docker Image SBOM (Syft) job failure:
#   ROOT CAUSE: torch==2.2.0 (PyPI) resolves NVIDIA CUDA extras on linux/amd64:
#     nvidia-cublas-cu12, libcublaslt.so.12, nvidia-cudnn-cu12, etc.
#     Total CUDA dependency chain: ~3-4 GB.
#   GitHub Actions ubuntu-latest runner total disk: ~14 GB.
#   Docker build writes nvidia/cublas/lib/libcublaslt.so.12 (~3.10 GB layer)
#   during image export -> "no space left on device" (runner disk exhausted).
#
#   FIX -- Two coordinated changes (both required):
#   1. Dockerfile v47.1: CPU_ONLY=true build arg skips CUDA torch install.
#   2. sbom-docker job: Free ~12 GB runner disk before build; pass CPU_ONLY=true.
#
# v47.4 -- Install Grype step failure (run #175):
#   ROOT CAUSE: curl|sh grype v0.77.0 install got HTTP 504 from GitHub CDN.
#   FIX: 3-attempt retry loops for Grype + Syft installs; upgraded to v0.87.0.
#        docker/build-push-action v5 -> v6 (Node.js 24 native).
#
# v47.5 (this fix) -- "Set up Docker Buildx" transient Docker Hub timeout:
#   ROOT CAUSE: docker/setup-buildx-action default driver (docker-container)
#     creates a BuildKit container instance by pulling moby/buildkit:buildx-stable-1
#     from Docker Hub (registry-1.docker.io). GitHub-hosted runners have
#     intermittent Docker Hub rate-limit / network timeouts:
#
#     ERROR: Error response from daemon: Head
#       "https://registry-1.docker.io/v2/moby/buildkit/manifests/buildx-stable-1":
#       Get "https://auth.docker.io/token?...":
#       net/http: request canceled (Client.Timeout exceeded while awaiting headers)
#
#   FIX (minimal blast radius — Set up Docker Buildx step only):
#     Add driver: docker to setup-buildx-action.
#     The 'docker' driver uses BuildKit already embedded in the Docker Engine
#     (Docker 23+ ships BuildKit built-in). No network pull from Docker Hub
#     required — entirely offline, 100% elimination of the transient failure
#     surface.
#
#     Consequence: docker driver does not support GHA cache exporters.
#     Remove cache-from: type=gha from the SBOM build step (this is an
#     SBOM-only scan build; caching is optimization-only, never correctness).
#     No other change to the build step.
#
#   Production impact: NONE. SBOM outputs (CycloneDX + SPDX JSON via Syft)
#   are semantically identical. The Docker build still uses BuildKit — the
#   same engine, just the built-in daemon-resident instance rather than an
#   external container pulled from Docker Hub.
#
#   Python SBOM job (sbom-python) unchanged — it passes, don't touch it.
# ============================================================================

name: SBOM Generation -- CycloneDX + SPDX

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - Dockerfile
      - "**/*.py"
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: sbom-generation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # P0 (2026-09-10, public-repo zero-trust): narrowed from a workflow-wide
  # contents: write. Of this workflow's 4 jobs, only `attach-to-release`
  # (softprops/action-gh-release, which needs contents:write to attach
  # assets to a GitHub Release) writes anything; `sbom-python`/`sbom-docker`
  # only generate SBOM files and upload them as workflow artifacts, and
  # `sbom-gate` only inspects other jobs' .result -- neither touches git or
  # any GitHub write API. attach-to-release now declares its own job-level
  # contents: write below instead.
  #
  # security-events: write removed outright, not narrowed: verified via
  # repo-wide grep that no step in this file calls upload-sarif or any
  # other Security-tab API -- this workflow has never produced SARIF
  # output (SAST's own sast-security-scan.yml already owns that), so the
  # grant did nothing.
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.11"
  SBOM_DIR: sbom-output

jobs:

  # --------------------------------------------------------------------------
  # Python SBOM (CycloneDX)
  # --------------------------------------------------------------------------
  sbom-python:
    name: Python SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0  # v48.0: Node.js 24 native (eliminates Node.js 20 deprecation warning)
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CycloneDX Python
        run: pip install "cyclonedx-bom==4.4.3"

      - name: Validate CycloneDX toolchain
        run: |
          INSTALLED=$(pip show cyclonedx-bom | grep '^Version:' | awk '{print $2}')
          EXPECTED="4.4.3"
          echo "cyclonedx-bom installed: $INSTALLED"
          if [[ "$INSTALLED" != "$EXPECTED" ]]; then
            echo "::error::cyclonedx-bom version mismatch. Expected $EXPECTED, got $INSTALLED."
            exit 1
          fi
          if ! command -v cyclonedx-py &>/dev/null; then
            echo "::error::cyclonedx-py binary not found on PATH."
            exit 1
          fi
          echo "cyclonedx-py: $(which cyclonedx-py)"
          cyclonedx-py --version || true
          echo "Toolchain pre-validation passed."

      - name: Generate CycloneDX JSON SBOM
        # FIX: --output-file removed in cyclonedx-bom==4.4.3.
        # Correct syntax: redirect stdout to target file with shell >.
        run: |
          mkdir -p "${{ env.SBOM_DIR }}"

          cyclonedx-py requirements requirements.txt \
            --output-format JSON \
            > "${{ env.SBOM_DIR }}/sbom-python-cyclonedx.json"

          JSON_FILE="${{ env.SBOM_DIR }}/sbom-python-cyclonedx.json"
          if [ ! -f "$JSON_FILE" ]; then
            echo "::error::CycloneDX JSON SBOM not generated (file missing)"
            exit 1
          fi
          FILESIZE=$(wc -c < "$JSON_FILE")
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::CycloneDX JSON SBOM too small (${FILESIZE} bytes)"
            exit 1
          fi
          jq '.' "$JSON_FILE" > /dev/null 2>&1 || { echo "::error::SBOM JSON is invalid"; exit 1; }
          echo "CycloneDX JSON SBOM generated: ${FILESIZE} bytes"

      - name: Generate CycloneDX XML SBOM
        run: |
          cyclonedx-py requirements requirements.txt \
            --output-format XML \
            > "${{ env.SBOM_DIR }}/sbom-python-cyclonedx.xml"

          XML_FILE="${{ env.SBOM_DIR }}/sbom-python-cyclonedx.xml"
          if [ ! -f "$XML_FILE" ]; then
            echo "::error::CycloneDX XML SBOM not generated (file missing)"
            exit 1
          fi
          FILESIZE=$(wc -c < "$XML_FILE")
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::CycloneDX XML SBOM too small (${FILESIZE} bytes)"
            exit 1
          fi
          echo "CycloneDX XML SBOM generated: ${FILESIZE} bytes"

      - name: Validate SBOM contents
        run: |
          JSON_FILE="${{ env.SBOM_DIR }}/sbom-python-cyclonedx.json"
          SPEC_VER=$(jq -r '.specVersion // "?"' "$JSON_FILE")
          COMP_COUNT=$(jq '.components | length' "$JSON_FILE")
          TIMESTAMP=$(jq -r '.metadata.timestamp // "?"' "$JSON_FILE")
          SERIAL=$(jq -r '.serialNumber // "?"' "$JSON_FILE")

          echo "SBOM Schema Version: $SPEC_VER"
          echo "Component Count:     $COMP_COUNT"
          echo "Generated:           $TIMESTAMP"
          echo "BOM Serial:          $SERIAL"

          if [ "$COMP_COUNT" -eq "0" ]; then
            echo "::error::SBOM contains no components -- possible generation failure"
            exit 1
          fi

          echo "Top 10 components:"
          jq -r '.components[:10][] | "  \(.name // "?")@\(.version // "?") [\(.type // "?")]"' "$JSON_FILE"

      - name: Upload Python SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2  # v48.0: latest v4 patch (FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 ensures Node.js 24)
        with:
          name: sbom-python-${{ github.sha }}
          path: ${{ env.SBOM_DIR }}/
          retention-days: 90

  # --------------------------------------------------------------------------
  # Docker SBOM (Syft / Grype)
  # --------------------------------------------------------------------------
  sbom-docker:
    name: Docker Image SBOM (Syft)
    runs-on: ubuntu-latest
    # v47.3: raised from 20 -> 30 min; CPU torch download adds ~2 min
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── v47.3 FIX: Free runner disk space BEFORE Docker build ─────────────
      # torch==2.2.0 with CUDA deps (~3-4 GB) + Docker image export exhausts
      # the ~14 GB ubuntu-latest runner. Remove pre-installed tools that are
      # not needed for this job. Frees ~10-12 GB headroom.
      - name: Free runner disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /

          # Remove large pre-installed tool bundles not needed for SBOM scanning
          sudo rm -rf /usr/share/dotnet           # .NET SDK: ~2.0 GB
          sudo rm -rf /usr/local/lib/android      # Android SDK: ~9.0 GB
          sudo rm -rf /opt/ghc                    # Haskell GHC: ~2.5 GB
          sudo rm -rf /opt/hostedtoolcache/CodeQL # CodeQL: ~1.0 GB
          sudo rm -rf /usr/local/share/boost      # Boost C++: ~1.3 GB
          sudo rm -rf /usr/local/share/powershell # PowerShell: ~0.5 GB

          # Clean apt package cache
          sudo apt-get clean

          # Remove dangling Docker images/layers from runner pre-pull
          docker system prune --all --force --volumes 2>/dev/null || true

          echo "=== Disk usage after cleanup ==="
          df -h /

          # Abort early if still less than 10 GB free (safety guard)
          FREE_GB=$(df / | awk 'NR==2 {printf "%.0f", $4/1024/1024}')
          echo "Free disk: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt "10" ]; then
            echo "::error::Insufficient disk after cleanup (${FREE_GB} GB free, need >=10 GB)"
            exit 1
          fi
          echo "Disk space check passed: ${FREE_GB} GB free"

      # v47.5 FIX: driver: docker uses Docker Engine's built-in BuildKit.
      # Default driver (docker-container) pulls moby/buildkit:buildx-stable-1
      # from Docker Hub, causing intermittent network timeouts on GHA runners.
      # docker driver is embedded in the daemon — zero Docker Hub network calls.
      # v184.8 FIX: docker/*, softprops/action-gh-release below were on floating
      # major-version tags (@v3, @v6, @v2) -- if any of those tags were ever
      # re-pointed (compromised upstream or moved by the maintainer), the next
      # run would silently pull different code. Pinned to the commit SHA each
      # tag currently resolves to (matches the anchore/* pattern already used
      # correctly in this file); version kept in the trailing comment for
      # readability/upgrade tracking.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker

      # ── v47.3 FIX: Build with CPU_ONLY=true ──────────────────────────────
      # Passes --build-arg CPU_ONLY=true to the Dockerfile builder stage.
      # v184.7: Dockerfile's sed now derives the torch version pinned in
      # requirements.txt via regex backreference (torch==\1+cpu) instead of
      # hardcoding "2.2.0+cpu" -- so this appends +cpu to whatever torch
      # version is actually pinned (currently 2.13.0) and installs from
      # download.pytorch.org/whl/cpu (no CUDA extras, ~200 MB).
      # cache-to intentionally omitted: CPU build != production cache key.
      # v47.4: upgraded @v5 -> @v6 (Node.js 24 native).
      # v47.5: cache-from removed — docker driver does not support GHA cache
      #   exporters. Caching is optimization-only for this SBOM scan build.
      - name: Build Docker image for SBOM scanning (CPU-only torch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: cdb-sentinel-apex:sbom-scan
          build-args: |
            CPU_ONLY=true

      - name: Verify image loaded and show disk usage
        run: |
          docker image inspect cdb-sentinel-apex:sbom-scan \
            --format '{{.Size}}' | awk '{printf "Image size: %.2f GB\n", $1/1024/1024/1024}'
          echo "=== Disk after Docker build ==="
          df -h /

      # ── v47.6 FIX (run #337, 2026-08-12): curl|sh install.sh depends on
      # raw.githubusercontent.com + github.com/anchore/syft/releases/<tag>
      # resolution. Both v47.4's retry loop (3 attempts, 30/60s backoff) and
      # curl's own --retry 3 were exhausted: HTTP 503, 000, 503 across all 3
      # attempts (transient GitHub CDN/release-API outage). Replaced with
      # Anchore's maintained download-syft GitHub Action, which installs via
      # GitHub Actions' own toolcache/download path instead of a piped shell
      # script -- eliminating the ORIGINAL failure surface (install.sh's own
      # multi-round-trip tag resolution). Same SYFT_VERSION pin (v1.3.0)
      # preserved; syft is invoked via the action's `cmd` output per its
      # documented usage, not a bare `syft` on PATH.
      #
      # v47.7 FIX (run #339, 2026-08-12): the Anchore action itself has NO
      # retry logic -- confirmed live: run #339's Grype install (same action
      # family, same v47.6 fix) failed on a single HTTP 503 from
      # github.com/.../releases/download/, right after this Syft step
      # succeeded in the same run. `uses:` steps can't be wrapped by
      # nick-fields/retry (shell-command-only, verified) or looped inline in
      # bash, so this restores the same 3-attempt/30s-60s-backoff resilience
      # v47.4 proved effective, applied to the action invocation itself via
      # GitHub Actions' native continue-on-error + conditional-step idiom.
      # Applied to both Syft and Grype for the identical, symmetric risk.
      - name: Install Syft (attempt 1)
        id: syft-1
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.3.0

      - name: Wait before Syft retry 1
        if: steps.syft-1.outcome == 'failure'
        run: |
          echo "::warning::[syft-install] Attempt 1 failed, sleeping 30s..."
          sleep 30

      - name: Install Syft (attempt 2)
        id: syft-2
        if: steps.syft-1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.3.0

      - name: Wait before Syft retry 2
        if: steps.syft-1.outcome == 'failure' && steps.syft-2.outcome == 'failure'
        run: |
          echo "::warning::[syft-install] Attempt 2 failed, sleeping 60s..."
          sleep 60

      - name: Install Syft (attempt 3)
        id: syft-3
        if: steps.syft-1.outcome == 'failure' && steps.syft-2.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.3.0

      - name: Resolve Syft install result
        id: syft-install
        run: |
          if [ "${{ steps.syft-1.outcome }}" = "success" ]; then
            echo "cmd=${{ steps.syft-1.outputs.cmd }}" >> "$GITHUB_OUTPUT"
            echo "[syft-install] Success on attempt 1"
          elif [ "${{ steps.syft-2.outcome }}" = "success" ]; then
            echo "cmd=${{ steps.syft-2.outputs.cmd }}" >> "$GITHUB_OUTPUT"
            echo "[syft-install] Success on attempt 2"
          elif [ "${{ steps.syft-3.outcome }}" = "success" ]; then
            echo "cmd=${{ steps.syft-3.outputs.cmd }}" >> "$GITHUB_OUTPUT"
            echo "[syft-install] Success on attempt 3"
          else
            echo "::error::[syft-install] All 3 attempts failed. GitHub release CDN unavailable."
            exit 1
          fi

      - name: Generate Docker SBOM (CycloneDX + SPDX)
        run: |
          mkdir -p "${{ env.SBOM_DIR }}"
          ${{ steps.syft-install.outputs.cmd }} cdb-sentinel-apex:sbom-scan \
            --output "cyclonedx-json=${{ env.SBOM_DIR }}/sbom-docker-cyclonedx.json" \
            --output "spdx-json=${{ env.SBOM_DIR }}/sbom-docker-spdx.json"

          # Validate outputs
          for f in sbom-docker-cyclonedx.json sbom-docker-spdx.json; do
            FPATH="${{ env.SBOM_DIR }}/$f"
            if [ ! -f "$FPATH" ]; then
              echo "::error::Syft SBOM missing: $f"
              exit 1
            fi
            SZ=$(wc -c < "$FPATH")
            echo "Syft $f: ${SZ} bytes"
            if [ "$SZ" -lt 100 ]; then
              echo "::error::Syft SBOM suspiciously small: $f (${SZ} bytes)"
              exit 1
            fi
          done

          COMP_COUNT=$(jq '.components | length' \
            "${{ env.SBOM_DIR }}/sbom-docker-cyclonedx.json")
          echo "Docker SBOM component count: ${COMP_COUNT}"
          if [ "${COMP_COUNT}" -eq "0" ]; then
            echo "::error::Docker SBOM has zero components"
            exit 1
          fi

      # ── v47.6 FIX: same curl|sh -> GitHub Action swap as Syft above, applied
      # for consistency. Grype's install.sh already failed once via this exact
      # pattern (run #175, HTTP 504); v47.4's retry loop only masked the
      # underlying fragility rather than removing it. Anchore's maintained
      # download-grype action removes the same piped-shell-script dependency.
      # GRYPE_VERSION pin (v0.87.0) preserved unchanged.
      #
      # v47.7 FIX (run #339, 2026-08-12): CONFIRMED LIVE -- this exact step
      # (the v47.6 action-based install, no retry loop) failed with a single
      # HTTP 503 from github.com/anchore/grype/releases/download/..., right
      # after Install Syft succeeded in the same run using the identical
      # action family. See the v47.7 note on Install Syft above for why the
      # fix is a native continue-on-error + conditional-step retry (3
      # attempts, 30/60s backoff) rather than a wrapper action -- applied
      # here symmetrically.
      - name: Install Grype (attempt 1)
        id: grype-1
        continue-on-error: true
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: v0.87.0

      - name: Wait before Grype retry 1
        if: steps.grype-1.outcome == 'failure'
        run: |
          echo "::warning::[grype-install] Attempt 1 failed, sleeping 30s..."
          sleep 30

      - name: Install Grype (attempt 2)
        id: grype-2
        if: steps.grype-1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: v0.87.0

      - name: Wait before Grype retry 2
        if: steps.grype-1.outcome == 'failure' && steps.grype-2.outcome == 'failure'
        run: |
          echo "::warning::[grype-install] Attempt 2 failed, sleeping 60s..."
          sleep 60

      - name: Install Grype (attempt 3)
        id: grype-3
        if: steps.grype-1.outcome == 'failure' && steps.grype-2.outcome == 'failure'
        continue-on-error: true
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: v0.87.0

      - name: Resolve Grype install result
        id: grype-install
        run: |
          if [ "${{ steps.grype-1.outcome }}" = "success" ]; then
            echo "cmd=${{ steps.grype-1.outputs.cmd }}" >> "$GITHUB_OUTPUT"
            echo "[grype-install] Success on attempt 1"
          elif [ "${{ steps.grype-2.outcome }}" = "success" ]; then
            echo "cmd=${{ steps.grype-2.outputs.cmd }}" >> "$GITHUB_OUTPUT"
            echo "[grype-install] Success on attempt 2"
          elif [ "${{ steps.grype-3.outcome }}" = "success" ]; then
            echo "cmd=${{ steps.grype-3.outputs.cmd }}" >> "$GITHUB_OUTPUT"
            echo "[grype-install] Success on attempt 3"
          else
            echo "::error::[grype-install] All 3 attempts failed. GitHub release CDN unavailable."
            exit 1
          fi

      # v48.0 FIX: Run Grype with .grype.yaml policy.
      # Policy: fail only on CRITICAL CVEs that have an available fix.
      # CVEs with fix-state=not-fixed/wont-fix are suppressed (no patch exists).
      # torch CVEs suppressed (CPU-only SBOM scan image, not production).
      # Root cause of prior failures: cryptography==42.0.2 (CVE-2024-26130
      # CRITICAL 9.1) and aiohttp==3.9.2 (CVE-2024-27306 CRITICAL) — both
      # fixed by requirements.txt updates in this commit.
      - name: Run Grype CVE scan against SBOM
        run: |
          ${{ steps.grype-install.outputs.cmd }} "sbom:${{ env.SBOM_DIR }}/sbom-docker-cyclonedx.json" \
            --config .grype.yaml \
            --output json \
            --file "${{ env.SBOM_DIR }}/grype-vulnerabilities.json" \
            --fail-on critical \
            || GRYPE_EXIT=$?

          if [ ! -f "${{ env.SBOM_DIR }}/grype-vulnerabilities.json" ]; then
            # v184.3 FIX: a missing output file here means Grype itself
            # crashed/errored before writing anything (a `--output json --file`
            # invocation always writes a file, even with zero matches) -- this
            # previously exited 0 regardless, silently reporting "scan passed"
            # for a scan that never actually ran or completed. GRYPE_EXIT (set
            # above via `|| GRYPE_EXIT=$?`) now decides: a real tool failure
            # fails this step; otherwise this stays a soft no-op as before.
            echo "Could not parse Grype output -- skipping vulnerability summary"
            if [ -n "${GRYPE_EXIT:-}" ] && [ "${GRYPE_EXIT}" -ne 0 ]; then
              echo "::error::Grype scan did not complete (exit ${GRYPE_EXIT}) and produced no output -- treating as failed."
              exit 1
            fi
            exit 0
          fi

          # v184.4 FIX: the file-exists branch below fed every jq extraction through
          # `2>/dev/null || echo "0"` -- a file that exists but is empty, truncated,
          # or has a `.matches` field that isn't an array (malformed/corrupted Grype
          # output) made every jq call error out, silently falling back to "0" for
          # TOTAL/CRITICAL/HIGH and reporting "Grype gate passed: 0 actionable
          # critical CVEs" for a scan whose output was never actually readable.
          # Validate structure before trusting any count derived from it.
          if ! jq -e '.matches | type == "array"' \
            "${{ env.SBOM_DIR }}/grype-vulnerabilities.json" > /dev/null 2>&1; then
            echo "::error::Grype output file exists but is not valid/well-formed JSON (missing or non-array .matches) -- cannot trust a zero-vulnerability result derived from it."
            exit 1
          fi

          TOTAL=$(jq '.matches | length' \
            "${{ env.SBOM_DIR }}/grype-vulnerabilities.json" 2>/dev/null || echo "0")
          CRITICAL=$(jq '[.matches[].vulnerability | select(.severity == "Critical")] | length' \
            "${{ env.SBOM_DIR }}/grype-vulnerabilities.json" 2>/dev/null || echo "0")
          HIGH=$(jq '[.matches[].vulnerability | select(.severity == "High")] | length' \
            "${{ env.SBOM_DIR }}/grype-vulnerabilities.json" 2>/dev/null || echo "0")
          IGNORED=$(jq '[.ignoredMatches // [] | length]' \
            "${{ env.SBOM_DIR }}/grype-vulnerabilities.json" 2>/dev/null || echo "0")
          echo "Grype: $TOTAL CVEs total | $CRITICAL CRITICAL | $HIGH HIGH | ignored per policy: $IGNORED"
          echo "::notice::Grype scan complete: $TOTAL matches, $CRITICAL critical (post-policy), $HIGH high"

          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::CRITICAL CVEs with available fix found in Docker image. Update base image / dependencies."
            exit 1
          fi
          echo "Grype gate passed: 0 actionable critical CVEs."

      - name: Upload Docker SBOM + Grype report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2  # v47.4: explicit patch pin
        if: always()
        with:
          name: sbom-docker-${{ github.sha }}
          path: ${{ env.SBOM_DIR }}/
          retention-days: 90

  # --------------------------------------------------------------------------
  # Attach SBOM to GitHub Release
  # --------------------------------------------------------------------------
  attach-to-release:
    name: Attach SBOM to Release
    needs: [sbom-python, sbom-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download Python SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-python-${{ github.sha }}
          path: sbom-python/

      - name: Download Docker SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-docker-${{ github.sha }}
          path: sbom-docker/
        continue-on-error: true

      - name: Upload SBOM to release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            sbom-python/sbom-python-cyclonedx.json
            sbom-python/sbom-python-cyclonedx.xml
            sbom-docker/sbom-docker-cyclonedx.json
            sbom-docker/sbom-docker-spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # SBOM Gate
  # --------------------------------------------------------------------------
  sbom-gate:
    name: SBOM Gate
    # v184.3 FIX: was needs: [sbom-python] only. sbom-docker's Grype step
    # correctly exit(1)s on a CRITICAL+fixable CVE, but that result was
    # invisible to this gate -- a production Docker image could ship a
    # CRITICAL fixable CVE, sbom-docker would go red, and this "SBOM Gate"
    # would still report "passed" because it never looked at sbom-docker at
    # all. sbom-docker only runs on main/release (if: github.ref ==
    # 'refs/heads/main' || github.event_name == 'release'), so its result is
    # legitimately 'skipped' on every other trigger -- checked for explicitly
    # below rather than requiring 'success' unconditionally.
    needs: [sbom-python, sbom-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Verify SBOM generation succeeded
        run: |
          if [[ "${{ needs.sbom-python.result }}" != "success" ]]; then
            echo "::error::Python SBOM generation failed."
            exit 1
          fi
          DOCKER_RESULT="${{ needs.sbom-docker.result }}"
          if [[ "$DOCKER_RESULT" != "success" && "$DOCKER_RESULT" != "skipped" ]]; then
            echo "::error::Docker image SBOM/vulnerability scan failed (result: $DOCKER_RESULT)."
            exit 1
          fi
          echo "SBOM gate passed."
