name: Pipeline Staleness Monitor v201.0

# CYBERDUDEBIVASH(R) SENTINEL APEX v184.0
# Checks critical workflows for staleness 4x daily.
# Sends Telegram alert if sentinel-blogger or generate-and-sync
# haven't succeeded within their expected cadence.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"  # 4x daily every 6 hours (80 min/day quota savings)
  workflow_dispatch:
    inputs:
      threshold_hours:
        description: "Override staleness threshold (hours)"
        required: false
        default: ""
        type: string

concurrency:
  group: sentinel-staleness-monitor
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-staleness:
    name: Pipeline Staleness Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Check pipeline staleness
        env:
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO:                     ${{ github.repository }}
          STALENESS_THRESHOLD_HOURS: ${{ github.event.inputs.threshold_hours || '' }}
        run: python3 scripts/check_pipeline_staleness.py
