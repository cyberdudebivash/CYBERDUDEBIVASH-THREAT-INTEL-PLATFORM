# SENTINEL APEX -- Report Generator Manifest-Format Regression Gate
#
# Guards against a regression of the P0 fixed in generate_intel_reports.py
# where running with --manifest api/feed.json (a top-level JSON array)
# crashed with `AttributeError: 'list' object has no attribute 'get'`.
# That crash was swallowed by run_pipeline.py's allow_fail=True "ID format
# migration pass", so items in api/feed.json silently never received a
# report_url -- producing permanent 404s on /reports/<yyyy>/<mm>/<id>.html.
#
# Also guards against the F-02 report-registry dual-writer conflict
# (scripts/generate_dashboard_feeds.py racing scripts/build_reports_index.py
# on api/reports/index.json / stats.json) and the related
# scripts/r2_reports_integrity.py total_reports/latest.json-purge bugs --
# see tests/test_report_registry_single_writer.py.
#
# Also guards against scripts/safe_git_commit.py silently discarding
# freshly generated customer-facing intelligence (api/v1/intel/latest.json,
# apex.json, etc.) during git conflict recovery -- found during live
# post-deploy verification -- see
# tests/test_safe_git_commit_artifact_recovery.py.
#
# Also guards against a false positive in scripts/pre_deploy_gate.py's
# "index.html script tags balanced" check, which used to count the raw
# substring '<script' vs '</script>' and could fail on prose (e.g. a code
# comment) that merely mentions "<script>" -- found during live post-deploy
# verification of STAGE 5.4.5d -- see
# tests/test_pre_deploy_gate_script_balance.py.
#
# Also guards against scripts/build_reports_index.py showing the raw report
# ID as the title, "UNKNOWN" severity, and a null risk score for the large
# majority of the public REPORTS catalogue -- api/feed.json only holds the
# current run's rolling window (~40-55 items) but reports/ retains every
# report ever generated (11,000+), so most reports' enrichment lookup came
# back empty. Found during live production certification -- see
# tests/test_build_reports_index_artifact_fallback.py.
#
# Also guards against api/reports/index.json, api/reports/latest.json, and
# api/reports/stats.json (written by build_reports_index.py, Stage 3.3.7)
# being missing from safe_git_commit.py's staging list and its
# _GENERATED_ARTIFACT_PATHS conflict-recovery guard -- a concurrent-push
# merge conflict silently reverted them to a stale prior-origin/main
# snapshot with no warning, while every sibling artifact (api/feed.json,
# api/v1/intel/latest.json, etc.) was correctly detected and restored.
# Found live: production served total_reports=356/21/81 across the three
# files -- mutually inconsistent and none matching the pipeline run's
# actual 11,805-file disk scan -- see
# tests/test_safe_git_commit_artifact_recovery.py.
#
# Also guards against scripts/frontend_integrity.py's `verify()` treating a
# protected asset with no registry entry as a mere warning instead of a
# gate failure -- meaning a deleted registry entry silently disabled tamper
# detection for that file while GATE E still reported PASS. Found during a
# security-control hardening review of the new frontend-integrity-sync.yml
# workflow (PR #166) -- see tests/test_frontend_integrity_p0.py.
#
# Also guards against a recurrence of the monetization gate's false-positive
# mojibake detection, which hard-failed generate-and-sync.yml on every run
# from #544 (2026-09-02T07:23Z) through #550 (2026-09-03T13:05Z) -- ~30 hours.
# scripts/validate_monetization.py's check_no_junk_chars() hand-rolled a second
# mojibake pattern list whose entries were the plain, CORRECT UTF-8 encodings
# of ordinary punctuation (b"\xe2\x80\x94" is simply U+2014 EM DASH), so any
# page with a legitimate em dash failed the gate. Because STAGE 5.7 runs before
# the publication stages, AI Tracker generation succeeded every run while
# api/ai/tracker.json was never committed or R2-synced -- the platform's AI
# features went stale silently. Fixed in #353; these tests pin BOTH directions
# (correct punctuation is never flagged, genuine double-encoded corruption
# still is) -- see tests/test_monetization_mojibake_detection.py.
#
# Also guards against STAGE 3.3 (scripts/validate_reports.py, the Report
# Validation Gate) permanently hard-failing every scheduled sentinel-blogger.yml
# run since PR #369/#370 landed. Root cause: PR #369 bounded report
# (re)generation to a rolling REPORT_WINDOW_HOURS window to stop the
# whole-corpus R2 cost incident, but reports/ is gitignored and never
# persisted across CI runs -- so on every fresh runner, any advisory outside
# that window has no local file, and this gate previously required EVERY
# manifest entry (including thousands of historical ones) to have one.
# Confirmed live in runs #2244/#2245: ~1,394 false-positive RULE 3 failures,
# 100% outside the window. Fixed by deferring (not failing) advisories that
# are either outside the rolling window or confirmed durably published via
# scripts/r2_report_publisher.py's own state -- an in-window genuinely
# missing report still hard-fails exactly as before -- see
# tests/test_validate_reports_window_deferral.py.
#
# Also guards against STAGE 5.4.1 (scripts/report_existence_validator.py)
# hard-failing with the exact same architectural mismatch, one gate later --
# confirmed live in run #2249 (the first natural run after the STAGE 3.3 fix
# above unblocked it): this sibling validator was never updated with the
# same rolling-window/publish-state awareness, so it still required every
# data/stix/feed_manifest.json entry (including the full historical corpus)
# to have a local file, hard-failing and skipping GitHub Pages deployment
# for the rest of that run. Fixed with the identical deferral logic, reusing
# the same scripts/r2_report_publisher.py helpers -- see
# tests/test_report_existence_validator_window_deferral.py.
#
# Also guards against STAGE 5.8.1b (scripts/report_url_canary.py --local)
# hard-failing with the exact same architectural mismatch, a THIRD time --
# confirmed live in run #2250 (the first natural run after the STAGE 3.3 and
# STAGE 5.4.1 fixes above both unblocked it, and after STAGE 5's GitHub
# Pages deploy had already succeeded): "LOCAL GATE: 214 ok / 184 missing /
# 0 invalid (of 398)". This third sibling gate independently re-checked
# on-disk report_url existence with no rolling-window/publish-state
# awareness at all. Fixed with the identical deferral logic, reusing the
# same scripts/r2_report_publisher.py helpers -- see
# tests/test_report_url_canary_window_deferral.py.
#
# Also guards against the P0 root cause of the 2026-08-26 core-feed
# staleness incident recurring: multi-source-intel.yml's intel-persistence
# step and scripts/safe_git_commit.py both used to retry `git push origin
# main` and, on exhaustion, only log a warning and exit 0 -- so
# true_intel_ingestor.py could genuinely fetch fresh intelligence every run
# while every byte of it was silently discarded once main's branch ruleset
# began rejecting direct runtime pushes. multi-source-intel.yml's step was
# since migrated to Cloudflare R2 (scripts/r2_state_sync.py) and no longer
# attempts a push at all; safe_git_commit.py's push-exhaustion branch now
# emits a loud `::error::` annotation instead of a bare warning. This test
# file existed under tests/ but, per post-merge verification of PR #390
# (2026-09-09 AI-plane persistence audit), was run by no workflow -- see
# tests/test_git_publish_no_silent_push_failure.py.
#
# Runs on every push and PR to main.

name: Report Generator Regression Gate v201.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: report-generator-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-format-regression:
    name: "generate_intel_reports.py -- list & dict manifest formats"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install pytest pyyaml requests==2.34.2 'PyJWT[crypto]==2.15.1' --quiet

      - name: P0 R41 source-evidence preservation and publication selection regressions
        run: python -m pytest tests/test_p0_r45_supplemental_rss_evidence.py tests/test_p0_r44_publication_boundary.py tests/test_p0_r41_publication_selection.py tests/test_p0_r39_rss_evidence.py tests/test_p0_r35_feed_prewrite_guard.py tests/test_v70_full.py -v --tb=short

      - name: Homepage ticker, SOC context and APT evidence regressions (offline)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install browser for P0 customer freshness regressions
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: P0 expired intelligence customer rendering regressions
        run: |
          node render-test/verify_watchdog_stale_state.js
          node render-test/verify_ai_threat_feed.js
          node render-test/verify_threat_map_chrome_render.js .

      - name: Run homepage ticker, SOC context and APT evidence regressions (offline)
        run: node --test tests/latest-advisory-ticker.test.cjs tests/top-threat-context.test.cjs workers/intel-gateway/src/__tests__/apt-contract.test.js

      - name: Scan malware customer release Python surfaces
        run: |
          python -m pip install bandit==1.7.8 --quiet
          python -m bandit core/malware/review_workspace.py core/malware/package_verifier.py core/malware/benchmark_contract.py core/malware/analysis_interchange.py core/malware/customer_release.py scripts/malware_customer_release.py --severity-level medium --confidence-level medium

      - name: Run malware evidence-review regression tests (P0 #590/#593)
        run: |
          python -m unittest discover -s tests -p test_malware_customer_release.py -v
          python -m pytest tests/test_resolve_malware_benchmark_request.py -v --tb=short
          python -m pytest tests/test_malware_review_workspace.py tests/test_malware_package_verifier.py tests/test_malware_analysis_interchange.py tests/test_malware_case_benchmark.py tests/test_malware_benchmark_contract.py tests/test_malware_customer_benchmark_workflow.py tests/test_malware_source_binding.py -v --tb=short

      # P0 2026-10-09: #2519 Stage 2.4 real production failure. The
      # attribution engine consumed dict-valued ATT&CK TTPs and crashed.
      # Run its typed-schema/false-attribution negative controls on every PR.
      - name: P0 attribution mixed-TTP schema and false-attribution regressions
        run: |
          python -m pytest tests/test_p0_attribution_structured_ttps.py -v --tb=short

      - name: P0 attribution source security scan
        run: |
          python -m bandit scripts/apex_attribution_engine_v2.py --severity-level medium --confidence-level medium

      - name: P0 R2 integrity release fence and authenticated HEAD negative controls
        run: |
          python -m pytest tests/test_p0_r2_integrity_release_fence.py -v --tb=short

      - name: P0 R2 verifier security scan
        run: |
          python -m bandit scripts/r2_upload_verifier.py --severity-level medium --confidence-level medium

      - name: P0 Revenue — weekly brief evidence, safe report links and plan-contract regression
        run: python -m pytest tests/test_weekly_customer_trust.py -v --tb=short

      - name: "P0 #788 — full 100-item latest projection fits unchanged 1MiB Worker cap"
        run: python -m pytest tests/test_p0_public_latest_byte_projection.py -v --tb=short

      - name: "P0 #788 — evidence score flags and EPSS conversion never inflate risk"
        run: python -m pytest tests/test_p0_evidence_score_truth.py -v --tb=short

      - name: Run manifest-format regression tests
        run: |
          python -m pytest tests/test_generate_intel_reports_manifest_formats.py -v --tb=short

      - name: Run report-registry single-writer regression tests (F-02)
        run: |
          python -m pytest tests/test_report_registry_single_writer.py -v --tb=short

      - name: Run cache-bust visibility regression test
        run: |
          python -m pytest tests/test_bust_kv_cache_visibility.py -v --tb=short

      - name: Run git-sync artifact-recovery regression tests
        run: |
          python -m pytest tests/test_safe_git_commit_artifact_recovery.py tests/test_certification_key_cleanup.py -v --tb=short

      - name: Run pre-deploy gate script-tag-balance regression tests
        run: |
          python -m pytest tests/test_pre_deploy_gate_script_balance.py -v --tb=short

      - name: Run reports-index artifact-fallback regression tests
        run: |
          python -m pytest tests/test_build_reports_index_artifact_fallback.py -v --tb=short

      - name: Run frontend integrity registry (GATE E) regression tests
        run: |
          python -m pytest tests/test_frontend_integrity_p0.py -v --tb=short

      - name: Run intelligence content contract regression tests (Phase 4)
        run: |
          python -m pytest tests/test_intelligence_content_contract.py -v --tb=short

      - name: Run --only-missing incremental repair regression tests (P0 report-continuity)
        run: |
          python -m pytest tests/test_generate_intel_reports_only_missing.py -v --tb=short

      - name: Run report materialization barrier regression tests (P0 report-continuity)
        run: |
          python -m pytest tests/test_report_materialization_barrier.py -v --tb=short

      - name: Run field-preserving-merge canonical-key regression tests (P0.2 report-continuity root cause)
        run: |
          python -m pytest tests/test_field_preserving_merge_canonical_key.py -v --tb=short

      - name: Run report-continuity barrier metrics observability tests (P0.2)
        run: |
          python -m pytest tests/test_report_continuity_barrier_metrics.py -v --tb=short

      - name: Run monetization-gate mojibake detection regression tests (P0 AI-publication stall)
        run: |
          python -m pytest tests/test_monetization_mojibake_detection.py -v --tb=short

      - name: Run Report Validation Gate rolling-window deferral regression tests (P0 report-validation stall)
        run: |
          python -m pytest tests/test_validate_reports_window_deferral.py -v --tb=short

      - name: Reject development milestone labels in customer copy
        run: python -m pytest tests/test_customer_copy_gate.py -v --tb=short

      - name: Run Report Existence Validator rolling-window deferral regression tests (P0 STAGE 5.4.1 deploy-skip)
        run: |
          python -m pytest tests/test_report_existence_validator_window_deferral.py -v --tb=short

      - name: Run Report URL Canary publication-status classification regression tests (v187.0)
        run: |
          python -m pytest tests/test_report_url_canary_classification.py -v --tb=short

      - name: Run Deployment Convergence report-slug regression tests (P0)
        run: |
          python -m pytest tests/test_deployment_convergence_report_slug.py -v --tb=short

      - name: Run Report URL Canary rolling-window deferral regression tests (P0 STAGE 5.8.1b false-positive gate failure)
        run: |
          python -m pytest tests/test_report_url_canary_window_deferral.py -v --tb=short

      - name: Run git-publish silent-push-failure regression tests (P0 2026-08-26 staleness incident)
        run: |
          python -m pytest tests/test_git_publish_no_silent_push_failure.py -v --tb=short

      # P0 FIX (2026-09-18, Telegram staleness-alert incident): this file
      # existed since PR #393 (2026-09-10) and its own module docstring
      # claims it "fails the build if any threshold here ever again
      # provides less than 1.3x headroom" -- but a repo-wide audit while
      # investigating a NEW staleness incident found it was never actually
      # wired into any workflow, so that claim was never true in CI. Wired
      # in here rather than a new workflow, matching this exact gate's own
      # precedent one step above (test_git_publish_no_silent_push_failure.py,
      # from the same PR #393) of reusing this always-on, unfiltered
      # push/PR-to-main gate for check_pipeline_staleness.py's regression
      # tests, since that script isn't scoped to reports specifically.
      - name: "Run pipeline-staleness threshold safety-margin regression tests (P0 PR #393, now actually wired in)"
        run: |
          python -m pytest tests/test_pipeline_staleness_thresholds.py -v --tb=short

      # P0 FIX (2026-09-18, Telegram staleness-alert incident): see
      # scripts/check_pipeline_staleness.py's get_latest_run()/
      # _latest_run_suffix() and automated-backup.yml's cf-data-backup job
      # comment for the full incident -- a stale alert previously linked
      # only to the last SUCCESSFUL run (an 8-day-old green checkmark),
      # which made a real, ongoing failure look like a false alarm on
      # inspection.
      - name: Run pipeline-staleness alert diagnostics regression tests (P0 2026-09-18 staleness incident)
        run: |
          python -m pytest tests/test_pipeline_staleness_diagnostics.py -v --tb=short

      - name: Reject OIDC algorithm confusion and invalid signing keys
        run: python -m pytest tests/test_oidc_rs256_migration.py -v --tb=short

      - name: Git metadata persistence and bounded pipeline regression
        run: python -m pytest tests/test_pipeline_p0_persistence_and_budget.py -v --tb=short
