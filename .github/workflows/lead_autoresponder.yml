name: CDB Lead-to-Cash Auto-Responder v201.0

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC  -  1:30 PM IST
  workflow_dispatch:       # Manual trigger for testing

permissions:
  contents: read   # read-only: this workflow sends emails, never writes to repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: lead-autoresponder
  cancel-in-progress: false

jobs:
  autoresponder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lead-to-Cash Auto-Responder
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: "CyberDudeBivash SENTINEL APEX"
        run: |
          python -m agent.lead_autoresponder
