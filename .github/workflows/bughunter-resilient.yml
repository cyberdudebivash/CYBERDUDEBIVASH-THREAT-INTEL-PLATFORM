# CYBERDUDEBIVASH SENTINEL APEX  -  Bug Hunter Resilient Recon
# Uses v54 resilient scanner with 3-tier subdomain fallback
# Runs every 8 hours + manual dispatch

name: Bug Hunter Resilient Recon v201.0

on:
  schedule:
    - cron: '15 */8 * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain'
        default: 'cyberdudebivash.com'
        required: false
      timeout:
        description: 'HTTP timeout (seconds)'
        default: '15'
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# Resource-scoped lock: this workflow reads shared intelligence but writes only
# its own derived namespace. A global sentinel-data-writer lock can starve or
# cancel pending jobs because GitHub concurrency retains only one pending run.
concurrency:
  group: sentinel-data-writer-bughunter
  cancel-in-progress: false

jobs:
  resilient-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name:  Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name:  Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name:  Install Dependencies
        run: |
          pip install requests --quiet

      - name:  Run Resilient Bug Hunter Scan
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          BH_TARGET_DOMAIN: ${{ github.event.inputs.domain || 'cyberdudebivash.com' }}
          BH_TIMEOUT: ${{ github.event.inputs.timeout || '15' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m agent.v54_bughunter_resilience.resilient_scanner \
            --domain "${BH_TARGET_DOMAIN}" \
            --timeout "${BH_TIMEOUT}"

      - name:  Validate Output
        run: |
          echo "=== Bug Hunter Output ==="
          python3 -c "
          import json
          with open('data/bughunter/bughunter_output.json') as f:
              d = json.load(f)
          m = d.get('metrics', {})
          print(f\"Subdomains:  {m.get('subdomains', 0)}\")
          print(f\"Live hosts:  {m.get('live_hosts', 0)}\")
          print(f\"Findings:    {m.get('total_findings', 0)}\")
          print(f\"Risk:        \${m.get('risk_exposure', 0):,}\")
          print(f\"Engines:     {len(d.get('engines', []))}/12\")
          has_data = m.get('subdomains', 0) > 0
          print(f\"Has data:    {'YES [OK]' if has_data else 'NO [FAIL]'}\")
          if not has_data:
              print('WARNING: Zero subdomains  -  external APIs may be down')
          "

      - name: Preserve generated recon artifacts for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "CYBERDUDEBIVASH"
          git config user.email "bivash@cyberdudebivash.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          test -s data/bughunter/bughunter_output.json
          git add -f data/bughunter/bughunter_output.json
          if [ -d data/bughunter/scan_history ]; then
            git add -f data/bughunter/scan_history/
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m " Bug Hunter v54 resilient scan  -  $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            python scripts/publish_generated_commit.py
          fi
