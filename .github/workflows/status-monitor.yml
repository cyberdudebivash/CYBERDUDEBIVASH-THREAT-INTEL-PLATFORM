# =============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX v134.0 — PLATFORM STATUS MONITOR
# Version: v184.0 — PERMANENT PRODUCTION CONTRACT
# HARDENING: 3x daily instead of hourly (200 min/day quota savings)
# =============================================================================
name: CDB Platform Status Monitor v201.0

on:
  schedule:
    - cron: '0 0,8,16 * * *'  # 3x daily: 00:00 UTC, 08:00 UTC, 16:00 UTC (200 min/day savings)
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: sentinel-guardian
  cancel-in-progress: true

jobs:
  status-check:
    name: Platform Health Check v134
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 1}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install requests --quiet
      - run: mkdir -p data/status

      - name: "Run Platform Status Monitor"
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          CDB_API_URL: ${{ vars.CDB_API_URL || 'https://api.cyberdudebivash.com' }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 scripts/run_platform_status_monitor.py

      - name: "Validate and stage status publication"
        run: |
          set -euo pipefail
          test -s data/status/status.json

          rm -rf .publish
          mkdir -p .publish/data/status
          cp -a data/status/. .publish/data/status/

          echo "Status publication manifest:"
          find .publish/data/status -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum

      - name: "Publish status to GitHub Pages"
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: .publish
          branch: gh-pages
          clean: false
          single-commit: false
          token: ${{ secrets.GH_TOKEN || github.token }}
          git-config-name: 'github-actions[bot]'
          git-config-email: 'github-actions[bot]@users.noreply.github.com'
          commit-message: 'deploy(status): Platform status update [skip ci]'
