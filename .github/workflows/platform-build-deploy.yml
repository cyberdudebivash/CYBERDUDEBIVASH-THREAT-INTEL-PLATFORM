# SENTINEL APEX — Platform Monorepo CI/CD Pipeline v2
# Builds, tests, security-scans, and deploys all microservices
#
# v49.0 RE-TRIGGER (2026-06-08): Force clean re-run after transient runner failure
#   on run #27120609276 (Security Scanning "Set up job" + Build ai-engine Buildx).
#   No functional changes — confirmed passing on 4 prior runs (latest: 26452585141).
#
# AUDIT FIX (2026-06-08):
#   Added concurrency group (prevents parallel builds on the same branch).
#   Added timeout-minutes to all jobs (prevents runaway builds consuming quota).
#   Pinned aquasecurity/trivy-action from @master -> @0.24.0 (stable, no
#     @master drift risk; exit-code=0 means it still won't fail the build).
name: platform-build-deploy

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform-build-deploy.yml"
      - ".gitleaks.toml"
      - "ruff.toml"
  pull_request:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform-build-deploy.yml"

# Prevent concurrent runs on the same ref.
# On push: cancel in-progress; old PR builds are superseded by new pushes.
# On pull_request: cancel in-progress; avoids wasted runner minutes.
concurrency:
  group: platform-build-deploy-${{ github.ref }}
  cancel-in-progress: true


# v184.3 FIX: packages: write and security-events: write were both granted at
# workflow level, so every job (lint, security-scan, build-frontend,
# validate-helm, terraform-validate, post-deploy-verify -- none of which touch
# a registry or upload SARIF) inherited a GITHUB_TOKEN with GHCR push rights
# it never needed. security-events: write turned out to be entirely unused --
# no job in this file calls github/codeql-action/upload-sarif or otherwise
# writes to the Security tab (confirmed via repo-wide grep) -- so it's dropped
# outright rather than rescoped. packages: write is moved to a job-level
# override on build-services (below), the only job that calls
# docker/login-action.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # v184.4 FIX: was hardcoded to `ghcr.io/cyberdudebivash/sentinel-apex` -- a
  # DIFFERENT org than this repo's actual owner (cyberdudebivash-pvt-ltd).
  # GITHUB_TOKEN's packages:write grant is scoped to ghcr.io/<repository
  # owner>/... only, so every push to that mismatched namespace was denied:
  # "failed to push ghcr.io/cyberdudebivash/sentinel-apex/<service>:latest:
  # denied: permission_denied: The requested installation does not exist."
  # This was invisible on every PR: `push:` below is gated on
  # `github.ref == 'refs/heads/main'`, so PR runs (build-only, push skipped)
  # always looked green -- the failure only fires on an actual push to main.
  # github.repository_owner always resolves to the real owner GITHUB_TOKEN
  # is actually authorized for.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sentinel-apex
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # 1. LINT + TYPE CHECK
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev tools
        run: pip install ruff mypy --break-system-packages 2>/dev/null || pip install ruff mypy

      - name: Ruff lint (with project config)
        run: ruff check platform/services/ --config ruff.toml

      - name: Type check (relaxed for service stubs)
        run: mypy platform/services/ --ignore-missing-imports --no-strict-optional --no-error-summary || true

  # ─────────────────────────────────────────────
  # 2. SECURITY SCAN
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-24.04
    # v185.6 FIX: was timeout-minutes: 15. gitleaks detect (no --no-git) scans
    # full commit history by default, and checkout uses fetch-depth: 0 for the
    # same reason -- both grow with the repo. Confirmed on PR #261 (two
    # consecutive runs, same commit): checkout ~4min + gitleaks still mid-scan
    # at the 15min mark, job cancelled with no secrets finding ever emitted --
    # not a detected leak, a starved budget. That means this gate had been
    # silently producing no result on both observed runs, not "no secrets found".
    # 30min was set as an interim ceiling, with the real long-term fix (scoping
    # gitleaks to just the new commits via --log-opts, instead of replaying
    # full history every run) deferred at the time.
    #
    # v200.0 FIX: the 30min ceiling itself got starved on PR #265 (job
    # cancelled at 30:16 -- same "no verdict" failure mode as #261), confirming
    # this comment's own prediction. Implemented the deferred fix in the
    # gitleaks step below: --log-opts now scopes each scan to just the commits
    # introduced by the current push/PR instead of the full history, falling
    # back to a full --all scan only when there's no valid base commit to diff
    # against. timeout-minutes stays at 30 as a safety net for that fallback.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trivy filesystem scan
        # v49.0 FIX: aquasecurity/trivy-action@0.24.0 is a Docker container action.
        # The Docker image pull happens during "Set up job" — if it fails (rate limit,
        # image unavailable, network blip) the whole job dies before any user step.
        # Replace with Trivy CLI install: we own the error boundary and can guarantee
        # non-blocking behaviour. Same scan coverage, no Docker pull at job init.
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /tmp/trivy-bin 2>/dev/null \
            || { echo "::warning::Trivy install failed — skipping filesystem scan"; exit 0; }
          /tmp/trivy-bin/trivy fs \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format table \
            platform/ \
            || echo "::warning::Trivy scan encountered errors (non-blocking)"

      - name: Bandit SAST
        run: |
          pip install bandit --break-system-packages 2>/dev/null || pip install bandit
          bandit -r platform/services/ -ll -q || true

      - name: Detect secrets (gitleaks)
        # v49.0 FIX: gitleaks/gitleaks-action@v2 has a pre-step that initialises
        # during "Set up job" and requires GITLEAKS_LICENSE. Without the secret the
        # entire job fails at init before any user step runs — continue-on-error
        # cannot rescue a pre-step failure. Replace with CLI install so we own the
        # error boundary.
        # SEC-2026-07-25: a real customer-API-key leak (data/sovereign/tenants.json,
        # committed on every purchase by revenue-orchestrator.yml) sat undetected
        # because a real "secrets found" result was reduced to a non-blocking
        # warning below. Download/tooling failure still doesn't block (an
        # infra hiccup isn't a security finding), but an actual detection now
        # fails the build. The two already-known, already-being-rotated files
        # are allowlisted in .gitleaks.toml so this doesn't fail every build
        # immediately -- see that file's SEC-2026-07-25 comment.
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks 2>/dev/null \
            || { echo "gitleaks download failed — skipping secret scan"; exit 0; }

          # Scope the scan to just the commits this push/PR introduces instead
          # of replaying the whole repo history every run -- see the
          # timeout-minutes comment above for why (full-history scans were
          # getting starved by the 30min ceiling). Falls back to a full --all
          # scan when there's no valid base commit to diff against (e.g. a
          # brand-new branch, or a `before` SHA this shallow-of-history-minus-0
          # checkout can't resolve), so coverage never silently narrows.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          # CodeRabbit (post-merge follow-up): only BASE_SHA was validated --
          # HEAD_SHA is always populated by GitHub itself for both event
          # types used here (a PR's real head commit, or the commit that
          # just triggered this push), so it can't actually be invalid in
          # practice, but validating it too costs nothing and removes the
          # theoretical case where gitleaks gets a range with a bad right
          # side instead of hitting the --all fallback.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
             && [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          else
            echo "::notice::gitleaks: no valid base commit for an incremental scan — falling back to full history"
            LOG_OPTS="--all"
          fi
          echo "gitleaks --log-opts: $LOG_OPTS"

          /tmp/gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts="$LOG_OPTS" \
            --log-level warn \
            --redact
          GITLEAKS_EXIT=$?
          if [ "$GITLEAKS_EXIT" -ne 0 ]; then
            echo "::error::gitleaks found potential secrets — see output above. Build blocked (this gate was non-blocking until a real customer-API-key leak was found in data/sovereign/tenants.json)."
            exit "$GITLEAKS_EXIT"
          fi

  # ─────────────────────────────────────────────
  # 3. BUILD MICROSERVICES
  # ─────────────────────────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - intel-core
          - ai-engine
          - billing-engine
          - soc-automation
          - agentshield
          - surfacewatch
          - exec-risk
          - intel-exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v184.8 FIX: docker/*, azure/setup-helm, hashicorp/setup-terraform below
      # were on floating major-version tags (@v3, @v4, @v6) -- this job holds
      # a GHCR login (docker/login-action) and pushes images
      # (docker/build-push-action), so a re-pointed upstream tag would run
      # arbitrary code with registry-push credentials. Pinned to the commit
      # SHA each tag currently resolves to; version kept in the trailing
      # comment for readability/upgrade tracking.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: platform/services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=sentinel-apex-${{ matrix.service }}
            org.opencontainers.image.vendor=CYBERDUDEBIVASH

  # ─────────────────────────────────────────────
  # 4. BUILD FRONTEND
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Enterprise Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform/frontend/package.json

      - name: Install dependencies
        working-directory: platform/frontend
        run: npm install --legacy-peer-deps

      - name: Type check
        working-directory: platform/frontend
        run: npx tsc --noEmit || true
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Next.js
        working-directory: platform/frontend
        run: npm run build || true
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ─────────────────────────────────────────────
  # 5. HELM VALIDATION
  # ─────────────────────────────────────────────
  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.15.0"

      # v2.1 FIX: confirmed live (run #65, 2026-08-29) -- this step failed
      # with "read tcp ...->185.199.108.153:443: read: connection reset by
      # peer" fetching grafana.github.io/helm-charts/index.yaml, a transient
      # GitHub Pages CDN blip, not a bad repo URL (the same repo add
      # succeeds on a plain retry). No retry/backoff existed here, unlike
      # every other external network call in this pipeline's Helm/SBOM jobs.
      # v2.2 FIX (CodeRabbit review on #364): Helm 3.15.0's `helm repo
      # update` exits 0 even when a repo's index download fails, unless
      # --fail-on-repo-update-fail is passed -- confirmed against the real
      # v3.15.0 binary. Without it, a genuine fetch failure would exit 0,
      # `&& break` on the first attempt, and silently skip the retry this
      # step exists to provide.
      - name: Add helm repos
        run: |
          for i in 1 2 3; do
            helm repo add bitnami https://charts.bitnami.com/bitnami \
              && helm repo add grafana https://grafana.github.io/helm-charts \
              && helm repo add prometheus-community https://prometheus-community.github.io/helm-charts \
              && helm repo update --fail-on-repo-update-fail \
              && break
            if [ "$i" = 3 ]; then
              echo "::error::helm repo add/update failed after 3 attempts"
              exit 1
            fi
            echo "::warning::helm repo add/update attempt $i failed (transient network), retrying in 15s..."
            sleep 15
          done

      - name: Helm dependency update
        run: |
          helm dependency update platform/infrastructure/kubernetes/helm/sentinel-apex/ \
            || helm dependency build platform/infrastructure/kubernetes/helm/sentinel-apex/ \
            || echo "WARNING: helm dep update incomplete — continuing"

      - name: Helm lint
        run: |
          helm lint platform/infrastructure/kubernetes/helm/sentinel-apex/ \
            --set global.imageRegistry=ghcr.io/${{ github.repository_owner }} || true

      - name: Helm template render
        run: |
          helm template sentinel-apex platform/infrastructure/kubernetes/helm/sentinel-apex/ \
            --set global.imageRegistry=ghcr.io/${{ github.repository_owner }} \
            --skip-crds \
            > /tmp/manifests.yaml \
          && echo "Manifest lines: $(wc -l < /tmp/manifests.yaml)" \
          || echo "WARNING: helm template skipped (missing dep charts — validated lint passed)"

  # ─────────────────────────────────────────────
  # 6. TERRAFORM VALIDATE
  # ─────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init (no backend)
        working-directory: platform/infrastructure/terraform/environments/production
        run: |
          terraform init -backend=false -input=false -upgrade \
            || terraform init -backend=false -input=false -upgrade -reconfigure \
            || (echo "WARNING: terraform init incomplete, attempting validate anyway" && true)

      - name: Terraform Validate
        working-directory: platform/infrastructure/terraform/environments/production
        run: terraform validate || true

      - name: Terraform Format Check
        working-directory: platform/infrastructure/terraform
        run: terraform fmt -check -recursive || true

  # ─────────────────────────────────────────────
  # 7. PRODUCTION HEALTH VERIFY
  # ─────────────────────────────────────────────
  # PRODUCTION-TRUTH FIX (release hardening audit): job id/name left
  # unchanged (unknown whether branch protection or an external integration
  # keys off this exact check name -- no tooling available this session to
  # verify either way, and this job's own pass/fail signal is genuinely
  # useful, so the safer fix is clarifying what it actually checks, not
  # renaming it). Despite the name, this job does NOT verify that this
  # workflow's own build was deployed -- it cannot. None of its four
  # dependencies apply anything to a running environment, though each does
  # more than a one-line summary can capture (CodeRabbit, PR #268: describe
  # accurately rather than implying these are each job's only command):
  # build-services pushes container images to GHCR, but only on pushes to
  # main (PR runs build only -- push is gated on github.ref); nothing in
  # this repo's CI ever pulls/runs those images either way (confirmed via
  # repo-wide search for kubectl apply/docker-compose up/helm install/SSH
  # deploy steps). build-frontend runs both `npx tsc --noEmit` and
  # `npm run build` (both tolerant of failure), with no publish step after
  # either. validate-helm lints/templates charts locally. terraform-validate
  # runs `terraform init` (best-effort) then `terraform validate`/
  # `fmt -check` (also failure-tolerant -- see the Deployment summary step
  # below). The checks below hit intel.cyberdudebivash.com, which is
  # deployed entirely by the separate deploy-worker.yml workflow: whenever
  # this job actually runs, its result is independent of whether this
  # workflow's own build succeeded. It doesn't always run, though -- it's
  # gated by `needs:` on all four jobs above, so a hard failure in one of
  # them (not the failure-tolerated kind, an actual job failure) skips this
  # health check entirely rather than reporting healthy. Still a genuinely
  # useful external smoke test when it runs (it does catch a real site
  # outage) -- just not evidence that this workflow deployed anything,
  # which the "Deployment summary" step below used to imply.
  post-deploy-verify:
    name: Live Platform Health Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build-services, build-frontend, validate-helm, terraform-validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check intel.cyberdudebivash.com (external, independently-deployed -- see job comment)
        # v184.3 FIX: neither check here could ever fail the job (the `&&
        # echo ... || echo ...` pattern always exits 0 regardless of which
        # branch runs), despite this job being named "Live Platform Health
        # Check" / "Production Health Verify" -- a genuinely down production
        # site would still show green. One retry after a short pause absorbs
        # a transient blip before treating it as a real failure.
        run: |
          for attempt in 1 2; do
            # v184.4 FIX: under default `bash -e`, a curl transport failure (DNS,
            # connection refused, timeout -- not just a non-200 response) would
            # abort this step immediately, skipping the retry entirely. Guard the
            # assignment so a transport failure is treated as a normal "not 200"
            # attempt and the retry loop actually gets to run twice.
            if ! STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://intel.cyberdudebivash.com/); then
              STATUS="000"
            fi
            echo "Platform HTTP (attempt $attempt): $STATUS"
            [ "$STATUS" = "200" ] && break
            [ "$attempt" = "1" ] && sleep 10
          done
          if [ "$STATUS" = "200" ]; then
            echo "✅ LIVE"
          else
            echo "::error::Platform health check failed — HTTP $STATUS after retry."
            exit 1
          fi

      - name: Check feed endpoint
        run: |
          for attempt in 1 2; do
            # v184.4 FIX: guard against curl transport failures aborting the step
            # under default `bash -e` before the retry loop's second attempt runs.
            if ! STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://intel.cyberdudebivash.com/api/feed.json); then
              STATUS="000"
            fi
            echo "Feed API (attempt $attempt): $STATUS"
            [ "$STATUS" = "200" ] && break
            [ "$attempt" = "1" ] && sleep 10
          done
          if [ "$STATUS" = "200" ]; then
            echo "✅ Feed OK"
          else
            echo "::error::Feed API health check failed — HTTP $STATUS after retry."
            exit 1
          fi

      - name: Deployment summary
        # CodeRabbit (PR #268 review): the previous wording here -- "Helm
        # charts linted; Terraform validated" -- still overstated what
        # validate-helm/terraform-validate actually guarantee. Every check
        # step in both jobs ends in `|| true` (Helm lint, Terraform
        # Validate, Terraform Format Check) or an `|| echo "WARNING..."`
        # fallback (Helm dependency update, Helm template render), so
        # both jobs report success even if the underlying command found
        # real errors -- confirmed by reading every step in both jobs.
        # Said plainly rather than implying a real pass/fail signal exists.
        run: |
          echo "🚀 SENTINEL APEX v184.0 — Platform build COMPLETE"
          echo "Commit: ${{ github.sha }}"
          echo "Service images built and pushed to GHCR (not deployed to any cluster by this workflow); Helm/Terraform checks ran (non-blocking -- every check step tolerates failure, so a green job here is not proof the charts/config are actually valid)"
          echo "Independently live (deployed by deploy-worker.yml, unaffected by this workflow): https://intel.cyberdudebivash.com"
