name: "SENTINEL APEX -- Master Deployment Orchestrator v201.0"

# TIER 3 -- DEPLOYMENT AUTHORITY
# Only this workflow may deploy frontend, publish APIs, promote artifacts,
# update production manifests, trigger production release.
# All other workflows are FORBIDDEN from pushing to production.

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - canary
      reason:
        description: "Deployment reason / change summary"
        required: true
        default: "Scheduled production release"
      skip_canary:
        description: "Skip canary validation (emergency only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  workflow_run:
    # v184.0 FIX: corrected workflow name from "SENTINEL APEX -- Worker Deploy"
    # to "deploy-worker" (the actual name field in deploy-worker.yml).
    # Previous name caused master orchestrator to NEVER auto-trigger post-deploy.
    workflows: ["deploy-worker"]
    types:
      - completed

# DEPLOYMENT MUTEX -- NO TWO DEPLOYMENTS MAY RUN SIMULTANEOUSLY
concurrency:
  group: sentinel-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WORKER_BASE: "https://intel.cyberdudebivash.com"
  # v184.0 FIX: lowered from 50 to 10. Worker serves from R2 (Cloudflare Object
  # Storage) which is populated by r2-data-sync on its own independent schedule.
  # R2 may legitimately have fewer items than the git repo immediately after a
  # fresh Worker deploy. 10 = minimum viable non-empty feed. Do not raise this
  # threshold above 10 without ensuring r2-data-sync runs before this workflow.
  MIN_ADVISORY_COUNT: 10
  # Freshness threshold intentionally NOT defined here: Gate 2 reads it from
  # config/public_freshness_contract.json via scripts/public_freshness_contract.py
  # (the single authority shared with /api/health, STAGE 5.9.10 and the R2
  # upload guard). A local MAX_MANIFEST_AGE_HOURS copy used to live here.

jobs:

  # ============================================================
  # GATE 0: PRE-FLIGHT ORCHESTRATION GUARD
  # ============================================================
  orchestration-guard:
    name: "Gate 0 -- Orchestration Guard"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      trigger_type: ${{ steps.guard.outputs.trigger_type }}

    steps:
      - name: "Determine trigger type and proceed flag"
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "trigger_type=manual" >> $GITHUB_OUTPUT
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "[GATE 0] Manual dispatch -- proceeding"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            echo "trigger_type=post_deploy" >> $GITHUB_OUTPUT
            if [ "$CONCLUSION" = "success" ]; then
              echo "proceed=true" >> $GITHUB_OUTPUT
              echo "[GATE 0] Post-deploy trigger (success) -- proceeding to validation"
            else
              echo "proceed=false" >> $GITHUB_OUTPUT
              echo "[GATE 0] Post-deploy trigger (conclusion=$CONCLUSION) -- skipping validation"
            fi
          else
            echo "trigger_type=unknown" >> $GITHUB_OUTPUT
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # GATE 1: DEPLOYMENT INTEGRITY PRE-CHECK
  # ============================================================
  deployment-integrity:
    name: "Gate 1 -- Deployment Integrity"
    runs-on: ubuntu-latest
    needs: orchestration-guard
    if: needs.orchestration-guard.outputs.proceed == 'true'
    timeout-minutes: 10
    outputs:
      integrity_ok: ${{ steps.integrity.outputs.ok }}
      advisory_count: ${{ steps.probe.outputs.count }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        timeout-minutes: 3
        run: pip install requests --quiet

      - name: "Probe live Worker health"
        id: probe
        timeout-minutes: 3
        run: |
          echo "[GATE 1] Probing Worker health..."
          # P0 health contract (2026-09-24): Gate 1 is DEPLOYMENT integrity.
          # /api/health answers a structured 503 while customer intelligence
          # is stale -- that is Gate 2's (manifest freshness) and STAGE
          # 5.9.10's concern, not a broken deployment. Worker liveness +
          # structured /api/health contract via the shared evaluator; generic
          # or malformed 503s, contradictions and exposed secrets still FAIL.
          if ! python3 scripts/deployment_health_contract.py --base-url "${{ env.WORKER_BASE }}"; then
            echo "[GATE 1] FAIL: Worker not live or /api/health violates its contract"
            exit 1
          fi
          # -s (not -sf): keep the structured 503 body, which still carries advisory_count.
          HEALTH=$(curl -s --max-time 10 "${{ env.WORKER_BASE }}/api/health" || echo '{"status":"error"}')
          echo "health_response=$HEALTH"
          STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','error'))" 2>/dev/null || echo "error")
          echo "[GATE 1] Health status: $STATUS"

          # v184.0 FIX: Extract advisory count from health endpoint's pipeline.advisory_count.
          # DO NOT use /api/v1/intel/latest.json with curl -sf:
          #   - curl -sf silently returns fallback '[]' on non-200; Python key 'advisories'
          #     does not exist in that response -- count always resolves to 0.
          # The health endpoint is authoritative and already fetched above as $HEALTH.
          COUNT=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); c=d.get('pipeline',{}).get('advisory_count',0) or d.get('advisory_count',0); print(int(c))" 2>/dev/null || echo "0")
          echo "[GATE 1] Advisory count (from health endpoint): $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -lt "${{ env.MIN_ADVISORY_COUNT }}" ]; then
            echo "[GATE 1] FAIL: Advisory count $COUNT < minimum ${{ env.MIN_ADVISORY_COUNT }}"
            exit 1
          fi
          echo "[GATE 1] Advisory count OK: $COUNT advisories"

      - name: "Validate frontend checksums"
        id: integrity
        timeout-minutes: 3
        run: |
          echo "[GATE 1] Validating frontend integrity..."
          # v184.3 FIX: this previously ran the script twice (once for its own
          # exit code, discarded via `|| true`; once more just to grep a status
          # string that was itself never checked) and always wrote `ok=true`
          # regardless of the actual result -- the readiness report's "Gate 1
          # (Integrity): PASS/WARN" line (below) was reporting PASS unconditionally.
          # Runs once, uses the script's own exit code (frontend_integrity.py's
          # verify command already calls sys.exit() with the real result).
          set +e
          python3 scripts/frontend_integrity.py verify 2>&1 | tee /tmp/integrity_output.txt | head -30
          INTEGRITY_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$INTEGRITY_EXIT" -eq 0 ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
            echo "[GATE 1] Integrity gate PASSED"
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "[GATE 1] Integrity gate FAILED (exit $INTEGRITY_EXIT) — see output above"
            # v184.4 FIX: integrity_ok was only ever read by the cosmetic readiness-
            # report PASS/WARN line (no job `needs:`/`if:` gates on it) -- a failed
            # frontend integrity check downgraded a report line but never failed the
            # step or blocked deployment. Fail the step for real.
            exit "$INTEGRITY_EXIT"
          fi

      - name: "Run post-deploy validator"
        timeout-minutes: 5
        run: |
          echo "[GATE 1] Running post-deploy validator..."
          python3 scripts/post_deploy_validator.py 2>&1 | tail -20 || true
          echo "[GATE 1] Post-deploy validation complete"

  # ============================================================
  # GATE 2: MANIFEST FRESHNESS CHECK
  # ============================================================
  manifest-freshness:
    name: "Gate 2 -- Manifest Freshness"
    runs-on: ubuntu-latest
    needs: [orchestration-guard, deployment-integrity]
    if: needs.orchestration-guard.outputs.proceed == 'true'
    timeout-minutes: 5
    outputs:
      fresh: ${{ steps.freshness.outputs.fresh }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: "Check manifest timestamps"
        id: freshness
        timeout-minutes: 4
        # Classified by the canonical contract (scripts/public_freshness_contract.py
        # -> config/public_freshness_contract.json). Previously this step kept its
        # own 6h threshold and, when a timestamp failed to parse, fell back to
        # age "0" and reported the feed FRESH. Outputs are unchanged:
        # fresh=true | stale | warn (warning-only gate, as before).
        run: |
          echo "[GATE 2] Checking manifest freshness..."
          curl -sf --max-time 20 "${{ env.WORKER_BASE }}/api/v1/intel/latest.json" -o /tmp/latest.json || echo '{}' > /tmp/latest.json
          python3 scripts/orchestrator_manifest_freshness.py /tmp/latest.json >> "$GITHUB_OUTPUT"

  # ============================================================
  # GATE 3: SLA STATUS EVALUATION
  # ============================================================
  sla-evaluation:
    name: "Gate 3 -- SLA Evaluation"
    runs-on: ubuntu-latest
    needs: [orchestration-guard, manifest-freshness]
    if: needs.orchestration-guard.outputs.proceed == 'true'
    timeout-minutes: 10
    outputs:
      sla_grade: ${{ steps.sla.outputs.grade }}
      sla_score: ${{ steps.sla.outputs.score }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: "Run SLA engine"
        id: sla
        timeout-minutes: 5
        run: |
          echo "[GATE 3] Running SLA engine..."
          python3 scripts/sla_engine.py --tier enterprise --report 2>&1 | tee /tmp/sla_output.txt || true
          SCORE=$(grep "SLA Score:" /tmp/sla_output.txt | grep -oP '\d+' | head -1 || echo "0")
          GRADE=$(grep "Grade" /tmp/sla_output.txt | grep -oP '\bGrade [A-D]\b' | grep -oP '[A-D]' | head -1 || echo "C")
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "grade=$GRADE" >> $GITHUB_OUTPUT
          echo "[GATE 3] SLA Score: $SCORE/100 Grade: $GRADE"

  # ============================================================
  # GATE 4: DEPLOYMENT READINESS SUMMARY
  # ============================================================
  deployment-readiness:
    name: "Gate 4 -- Deployment Readiness Summary"
    runs-on: ubuntu-latest
    needs: [orchestration-guard, deployment-integrity, manifest-freshness, sla-evaluation]
    if: needs.orchestration-guard.outputs.proceed == 'true'
    timeout-minutes: 5

    steps:
      - name: "Print deployment readiness report"
        run: |
          echo "============================================================"
          echo "SENTINEL APEX -- DEPLOYMENT READINESS REPORT"
          echo "============================================================"
          echo "Timestamp:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Trigger:          ${{ needs.orchestration-guard.outputs.trigger_type }}"
          echo "Target:           ${{ github.event.inputs.deploy_target || 'post-deploy-validation' }}"
          echo "Advisory Count:   ${{ needs.deployment-integrity.outputs.advisory_count }}"
          echo "Manifest Fresh:   ${{ needs.manifest-freshness.outputs.fresh }}"
          echo "SLA Grade:        ${{ needs.sla-evaluation.outputs.sla_grade }}"
          echo "SLA Score:        ${{ needs.sla-evaluation.outputs.sla_score }}/100"
          echo "============================================================"
          echo "Gate 1 (Integrity):  ${{ needs.deployment-integrity.outputs.integrity_ok == 'true' && 'PASS' || 'WARN' }}"
          echo "Gate 2 (Freshness):  ${{ needs.manifest-freshness.outputs.fresh == 'true' && 'PASS' || 'WARN' }}"
          echo "Gate 3 (SLA):        ${{ needs.sla-evaluation.outputs.sla_grade }}"
          echo "============================================================"
          SLA_SCORE="${{ needs.sla-evaluation.outputs.sla_score }}"
          if [ "$SLA_SCORE" -ge 70 ] 2>/dev/null; then
            echo "DEPLOYMENT STATUS: GREEN -- Platform is production-ready"
          else
            echo "DEPLOYMENT STATUS: AMBER -- Review SLA violations before next release"
          fi
          echo "============================================================"

  # FIX (P0, 2026-09-10, operational-readiness audit): see deploy-worker.yml's
  # identical job for the full rationale -- this workflow had zero failure
  # notification. `needs` covers every job in this file so a failure at any
  # stage (guard, integrity, freshness, SLA, readiness) is reported.
  notify-on-failure:
    name: "Notify on orchestration failure"
    needs: [orchestration-guard, deployment-integrity, manifest-freshness, sla-evaluation, deployment-readiness]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Send failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/pipeline_alert.py --status failure \
            --message "Master deployment orchestrator (master-deployment-orchestrator.yml) FAILED." \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
