# SENTINEL APEX -- Swarm Live Regression Gate
#
# workers/swarm-live had zero CI coverage: no workflow referenced it at all
# (confirmed by repository audit ahead of issue #420/#422), and its own
# package.json declared "test": "node --test src/index.test.mjs" for a file
# that did not exist, so `npm test` there silently no-op'd -- a regression
# in this worker's dispatch logic would never have been caught. This gate
# runs that suite (now written) on every push/PR touching this worker, and
# syntax-checks the source the same way its own "check" script does and
# bundles the Worker with Wrangler dry-run so config/binding/build regressions
# are caught before merge.
#
# This gate is validation-only. It never deploys workers/swarm-live;
# production promotion remains an explicit, separate release decision.
#
# Runs on every push and PR to main that touches this worker.

name: Swarm Live Regression Gate

on:
  push:
    branches: [main]
    paths:
      - 'workers/swarm-live/**'
      - 'workers/intel-gateway/src/index.js'
      - 'workers/intel-gateway/src/__tests__/swarm-synthesis-readiness-contract.test.js'
      - 'workers/intel-gateway/scripts/demo-key-operator.mjs'
      - 'workers/intel-gateway/scripts/demo-key-operator.contract.test.mjs'
      - 'workers/intel-gateway/package.json'
      - '.github/workflows/swarm-live-regression-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workers/swarm-live/**'
      - 'workers/intel-gateway/src/index.js'
      - 'workers/intel-gateway/src/__tests__/swarm-synthesis-readiness-contract.test.js'
      - 'workers/intel-gateway/scripts/demo-key-operator.mjs'
      - 'workers/intel-gateway/scripts/demo-key-operator.contract.test.mjs'
      - 'workers/intel-gateway/package.json'
      - '.github/workflows/swarm-live-regression-gate.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: swarm-live-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swarm-live-tests:
    name: "workers/swarm-live -- syntax + tests + Wrangler dry-run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/swarm-live

    steps:
      - name: " Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: " Setup Node.js 22"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: "Install locked worker dependencies"
        run: npm ci --ignore-scripts

      - name: "Syntax check (npm run check)"
        run: npm run check

      - name: "Run swarm-live regression suite (npm test)"
        run: npm test

      - name: "Wrangler production bundle dry-run"
        run: npm run deploy:dry -- --config wrangler.toml

      - name: "Install canonical gateway dependencies"
        working-directory: workers/intel-gateway
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: "Gateway SWARM synthesis readiness contract"
        working-directory: workers/intel-gateway
        run: node --test src/__tests__/swarm-synthesis-readiness-contract.test.js

      - name: "Demo-key operator safety contract"
        working-directory: workers/intel-gateway
        run: npm run test:demo-key-operator
