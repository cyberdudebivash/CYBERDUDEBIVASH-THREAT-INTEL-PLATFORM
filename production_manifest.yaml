schema_version: "1.0"
generated_by: "EPTP Phase 8 Batch 2"
last_updated: "2026-07-28"

production_runtime:
  platform: "Cloudflare Workers"
  gateway_version: "184.0"

production_workers:
  - name: intel-gateway
    path: workers/intel-gateway/
    responsibilities:
      - "Public API gateway (/api/v1/*, /reports/*, /auth/*)"
      - "Credential resolution (resolveAuth: API key + JWT)"
      - "Admin key issuance/revocation (/api/admin/keys)"
    entrypoint: workers/intel-gateway/src/index.js
  - name: revenue-engine
    path: workers/revenue-engine/
    responsibilities:
      - "Billing/subscription webhook handling (Razorpay)"
      - "Customer provisioning into the shared credential store"
    entrypoint: workers/revenue-engine/src/index.js
  - name: intel-retention-engine
    path: workers/intel-retention-engine/
    responsibilities:
      - "Data retention / lifecycle management"

production_deployment_pipeline:
  - workflow: .github/workflows/deploy-worker.yml
    deploys: [intel-gateway]
    trigger: [push, workflow_dispatch]
  - workflow: .github/workflows/deploy-revenue-engine.yml
    deploys: [revenue-engine]
    trigger: [push (paths filtered to workers/revenue-engine/**), workflow_dispatch]
    note: >
      Added to this manifest Batch 3 -- missed in Batch 2. Uses the same
      CF_API_TOKEN/CF_ACCOUNT_ID as deploy-worker.yml. Created specifically
      because revenue-engine previously had no CI deploy path at all.
  # intel-retention-engine has no dedicated deploy workflow found in this
  # repository as of this manifest's last update -- its production status
  # rests on Phase 3's evidence, not on a confirmed CI/CD path. See
  # COMPONENT_REGISTRY.json.

